[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-gate-observer"
version = "0.1.0"
description = "Independent, source-bound test observation for the original MUSA adaptation Gate"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
musa_gate_observer = "musa_gate_observer.server:register"

[tool.setuptools.packages.find]
include = ["musa_gate_observer*"]
