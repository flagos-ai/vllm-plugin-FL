# Per-platform test workflow, invoked by ci.yml / nightly.yml / weekly.yml
# via workflow_call (one invocation per platform).
#
# ci_stage controls which tests run:
#   pr      — functional (unit+functional merged) + e2e pr subset cases
#   nightly — functional + e2e main cases + benchmark
#   weekly  — functional + e2e full cases + benchmark
#
# Main steps:
# 1. setup:      Load platform config and generate test matrices
# 2. functional: Run unit + functional tests (ops, compilation, distributed)
# 3. e2e:        Run end-to-end model tests (pr=pr subset, nightly/weekly=full)
# 4. benchmark:  Validate vllm bench entrypoints (nightly/weekly only)
#
# Notes:
# - The discover job in ci.yml auto-scans enabled platforms and applies
#   diff-based routing before invoking this workflow.
# - For nightly/weekly all enabled platforms are always tested.
name: Platform Test

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      ci_stage:
        description: "CI stage: pr / nightly / weekly"
        required: false
        type: string
        default: "nightly"
    secrets:
      FEISHU_APP_ID:
        required: false
      FEISHU_APP_SECRET:
        required: false
      FEISHU_CHAT_ID:
        required: false

jobs:
  setup:
    name: "Setup (${{ inputs.platform }})"
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load.outputs.config }}
      e2e_matrix: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: load
        run: python .github/scripts/load_config.py --platform ${{ inputs.platform }}
      - id: matrix
        run: |
          python .github/scripts/generate_matrix.py \
            --platform ${{ inputs.platform }} \
            --ci-stage ${{ inputs.ci_stage }}

  # Unit + functional tests in one job (GPU runner required).
  # Unit tests (pure-logic) run first, then component-level GPU tests.
  functional:
    needs: setup
    uses: ./.github/workflows/_functional_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}

  # End-to-end model tests.
  # pr stage: pr subset cases (text + multimodal, one device).
  # nightly/weekly stage: main/full cases, all devices.
  e2e:
    needs: [setup, functional]
    if: needs.setup.outputs.e2e_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.setup.outputs.e2e_matrix) }}
    uses: ./.github/workflows/_e2e_test.yml
    with:
      platform: ${{ inputs.platform }}
      task: ${{ matrix.test.task }}
      device: ${{ matrix.test.device }}
      cases: ${{ matrix.test.cases }}
      ci_image: ${{ matrix.test.image || fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).device_runner_labels[matrix.test.device] || fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: ${{ matrix.test.timeout || 60 }}

  # Benchmark validation — runs for all stages; actual test selection
  # is controlled by the platform YAML (benchmark.pr / benchmark.nightly).
  benchmark:
    needs: [setup, e2e]
    if: always() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    uses: ./.github/workflows/_benchmark_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: 30
      ci_stage: ${{ inputs.ci_stage }}

  # Feishu notification — per-platform status, all stages.
  notify:
    needs: [functional, e2e, benchmark]
    if: always()
    uses: ./.github/workflows/_notify_feishu.yml
    with:
      platform: ${{ inputs.platform }}
      status: >-
        ${{ (needs.functional.result == 'success' &&
             (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
             (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped'))
            && 'success'
            || (needs.functional.result == 'cancelled' ||
                needs.e2e.result == 'cancelled' ||
                needs.benchmark.result == 'cancelled')
               && 'cancelled'
               || 'failure' }}
    secrets: inherit
