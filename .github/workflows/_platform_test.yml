# Per-platform test workflow, invoked by ci.yml via workflow_call (one job per platform).
#
# Main steps:
# 1. setup:      Load platform config and generate test matrices
# 2. unit:       Run unit tests with platform-specific include/exclude patterns
# 3. functional: Run component-level GPU tests (ops, compilation, distributed) — fast
# 4. e2e:        Run end-to-end model tests (inference, serving) — slow, needs model files
#
# Users can modify test settings in tests/platforms/*.yaml:
# - e2e: Add/remove model test cases in the support lists
# - functional: Adjust include/exclude patterns for component tests
# - unit: Add/remove paths in include and exclude lists
# - tolerance: Adjust numerical comparison tolerance for result validation
# - unsupported_features: Exclude test cases matching specific feature tags
#
# Notes:
# - This workflow only defines the orchestration; actual test logic lives in
#   _unit_test.yml, _functional_test.yml, and _e2e_test.yml.
# - The discover job in ci.yml auto-scans tests/platforms/*.yaml to determine
#   which platforms to test, then invokes this workflow for each one.
name: Platform Test

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      musa_allocation:
        description: "Explicit MUSA allocation JSON for this workflow only"
        required: false
        type: string
        default: ""
    secrets:
      FEISHU_APP_ID:
        required: false
      FEISHU_APP_SECRET:
        required: false
      FEISHU_CHAT_ID:
        required: false

# One MUSA allocation must not be shared by two workflow runs.
concurrency:
  group: ${{ inputs.platform == 'musa' && format('musa-{0}', github.repository) || format('platform-{0}-{1}', inputs.platform, github.run_id) }}
  cancel-in-progress: false

jobs:
  setup:
    name: "Setup (${{ inputs.platform }})"
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load.outputs.config }}
      e2e_matrix: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: load
        env:
          MUSA_CI_ALLOCATION: ${{ inputs.musa_allocation }}
          MUSA_CI_RUNTIME: ${{ vars.MUSA_CI_RUNTIME }}
          MUSA_CI_PHYSICAL_DEVICES: ${{ vars.MUSA_CI_PHYSICAL_DEVICES }}
          MUSA_CI_LOGICAL_DEVICES: ${{ vars.MUSA_CI_LOGICAL_DEVICES }}
          MUSA_CI_PCI_BUS_IDS: ${{ vars.MUSA_CI_PCI_BUS_IDS }}
          MUSA_CI_EMPTY_WHEEL: ${{ vars.MUSA_CI_EMPTY_WHEEL }}
          MUSA_CI_EMPTY_WHEEL_SHA256: ${{ vars.MUSA_CI_EMPTY_WHEEL_SHA256 }}
          MUSA_GATE_MODEL_27B: ${{ vars.MUSA_GATE_MODEL_27B }}
          MUSA_GATE_MODEL_35B_A3B: ${{ vars.MUSA_GATE_MODEL_35B_A3B }}
          MUSA_CI_IMAGE: ${{ vars.MUSA_CI_IMAGE }}
          MUSA_CI_DEPENDENCY_PROFILE: ${{ vars.MUSA_CI_DEPENDENCY_PROFILE }}
          MUSA_CI_DEPENDENCY_MANIFEST: ${{ vars.MUSA_CI_DEPENDENCY_MANIFEST }}
          MUSA_CI_DEPENDENCY_MANIFEST_SHA256: ${{ vars.MUSA_CI_DEPENDENCY_MANIFEST_SHA256 }}
        run: python .github/scripts/load_config.py --platform ${{ inputs.platform }}
      - id: changes
        name: Detect changed files (PR only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} > /tmp/changed_files.txt
            echo "file=/tmp/changed_files.txt" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            cat /tmp/changed_files.txt
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "Push event — no filtering"
          fi
      - id: matrix
        run: |
          CHANGED_ARG=""
          if [ -n "${{ steps.changes.outputs.file }}" ]; then
            CHANGED_ARG="--changed-files ${{ steps.changes.outputs.file }}"
          fi
          python .github/scripts/generate_matrix.py \
            --platform ${{ inputs.platform }} \
            $CHANGED_ARG

  unit:
    if: inputs.platform != 'musa'
    needs: setup
    uses: ./.github/workflows/_unit_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}

  # Fast component-level GPU tests (ops, compilation, distributed).
  # Runs all tests under tests/functional_tests/ in one job. No model files needed.
  # Runs once per platform (not per device) — functional tests are device-agnostic.
  functional:
    if: inputs.platform != 'musa'
    needs: [setup, unit]
    uses: ./.github/workflows/_functional_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}


  # Slow end-to-end model tests (inference, serving).
  # Grouped by (task, device) — all model/case combos for the same task
  # run inside a single job to avoid repeated container startup.
  e2e:
    needs: [setup, functional]
    if: inputs.platform != 'musa' && needs.setup.outputs.e2e_matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        test: ${{ fromJson(needs.setup.outputs.e2e_matrix) }}
    uses: ./.github/workflows/_e2e_test.yml
    with:
      platform: ${{ inputs.platform }}
      task: ${{ matrix.test.task }}
      device: ${{ matrix.test.device }}
      cases: ${{ matrix.test.cases }}
      ci_image: ${{ matrix.test.image || fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).device_runner_labels[matrix.test.device] || fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: ${{ matrix.test.timeout || 60 }}

  # Validates vllm bench throughput/latency/serve entrypoints.
  benchmark:
    if: inputs.platform != 'musa'
    needs: [setup, e2e]
    uses: ./.github/workflows/_benchmark_test.yml
    with:
      platform: ${{ inputs.platform }}
      ci_image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      runner_labels: ${{ toJson(fromJson(needs.setup.outputs.config).runner_labels) }}
      container_volumes: ${{ toJson(fromJson(needs.setup.outputs.config).container_volumes) }}
      container_options: ${{ fromJson(needs.setup.outputs.config).container_options }}
      timeout: 30

  # One MUSA runner and container retain the explicit four-device mapping
  # throughout the main test stages and the unchanged original Gate.
  # An operator must confirm the actual allocation before GPU execution;
  # a previous ephemeral runner probe does not reserve this runner's cards.
  musa_suite:
    name: MUSA complete suite and original adaptation Gate
    needs: setup
    if: inputs.platform == 'musa'
    runs-on: ${{ fromJson(needs.setup.outputs.config).runner_labels }}
    # Includes the existing E2E group bounds and four 6900-second Gate routes.
    timeout-minutes: 1200
    container:
      image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      volumes: ${{ fromJson(needs.setup.outputs.config).container_volumes }}
      options: ${{ fromJson(needs.setup.outputs.config).container_options }}
    env:
      VLLM_NO_USAGE_STATS: "1"
      MUSA_CI_E2E_MATRIX: ${{ needs.setup.outputs.e2e_matrix }}
      MUSA_CI_SUITE_IMAGE: ${{ fromJson(needs.setup.outputs.config).ci_image }}
    steps:
      - name: Set unique suite and Gate evidence directories
        run: |
          gate_root="${RUNNER_TEMP}/musa-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          suite_root="${RUNNER_TEMP}/musa-suite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'MUSA_GATE_ARTIFACT_DIR=%s\nMUSA_CI_RESULT_ROOT=%s\nMUSA_SUITE_ARTIFACT_DIR=%s\n' "$gate_root" "$gate_root" "$suite_root" >> "$GITHUB_ENV"
          mkdir -p "$suite_root/unit" "$suite_root/functional" "$suite_root/benchmark"
      - uses: actions/checkout@v4
      - name: Check the actual allocated devices and native PCI mapping
        id: devices
        timeout-minutes: 5
        run: bash .github/scripts/musa/check.sh
      - name: Install the isolated committed candidate
        id: install
        timeout-minutes: 60
        run: bash .github/scripts/musa/setup.sh
      - name: Verify owned child cleanup without accelerator allocation
        timeout-minutes: 1
        run: python -I -B .github/scripts/musa/tests/test_ci_serial.py
      - name: Run unit tests
        id: unit
        timeout-minutes: 361
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope unit
      - name: Run functional tests
        id: functional
        timeout-minutes: 16
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope functional
      - name: Run the existing E2E groups serially
        id: e2e
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope e2e
      - name: Run benchmark smoke tests
        id: benchmark
        if: steps.e2e.outputs.gpu_stages_safe == 'true'
        timeout-minutes: 31
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope benchmark
      - name: Run both original Gate models in eager and graph modes
        if: |
          always() && !cancelled() &&
          steps.devices.outcome == 'success' && steps.install.outcome == 'success' &&
          steps.unit.outputs.gpu_stages_safe == 'true' &&
          (steps.functional.outcome == 'skipped' || steps.functional.outputs.gpu_stages_safe == 'true') &&
          (steps.e2e.outcome == 'skipped' || steps.e2e.outputs.gpu_stages_safe == 'true') &&
          (steps.benchmark.outcome == 'skipped' || steps.benchmark.outputs.gpu_stages_safe == 'true')
        timeout-minutes: 500
        run: bash .github/scripts/musa/run-adaptation-gate.sh
      - name: Preserve all suite, Gate and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musa-adaptation-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MUSA_GATE_ARTIFACT_DIR }}
            ${{ env.MUSA_SUITE_ARTIFACT_DIR }}
            ${{ env.MUSA_CI_INSTALL_EVIDENCE }}
            coverage-musa.json
            report-musa.json
            test-results/logs
          if-no-files-found: error

  # ============================================================
  # Feishu notification — per-platform status
  # ============================================================
  notify:
    needs: [unit, functional, e2e, benchmark, musa_suite]
    if: always()
    uses: ./.github/workflows/_notify_feishu.yml
    with:
      platform: ${{ inputs.platform }}
      status: >-
        ${{ ((inputs.platform == 'musa' && needs.musa_suite.result == 'success') ||
             (inputs.platform != 'musa' &&
              needs.unit.result == 'success' &&
              needs.functional.result == 'success' &&
              (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
              (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped')))
            && 'success'
            || (needs.unit.result == 'cancelled' ||
                needs.functional.result == 'cancelled' ||
                needs.e2e.result == 'cancelled' ||
                needs.benchmark.result == 'cancelled' ||
                needs.musa_suite.result == 'cancelled')
               && 'cancelled'
               || 'failure' }}
