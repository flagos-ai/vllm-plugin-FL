# MUSA keeps all GPU stages on one allocated runner and container.
# The standard unit, functional, E2E and benchmark scopes use tests/run.py.
name: MUSA Test

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      musa_allocation:
        description: "Explicit MUSA allocation JSON for this workflow only"
        required: false
        type: string
        default: ""
    secrets:
      FEISHU_APP_ID:
        required: false
      FEISHU_APP_SECRET:
        required: false
      FEISHU_CHAT_ID:
        required: false

# Serialize MUSA allocations across workflow runs without cancelling an active suite.
concurrency:
  group: musa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    if: inputs.platform == 'musa'
    name: "Setup (${{ inputs.platform }})"
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load.outputs.config }}
      e2e_matrix: ${{ steps.matrix.outputs.e2e }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: load
        env:
          MUSA_CI_ALLOCATION: ${{ inputs.musa_allocation }}
          MUSA_CI_RUNTIME: ${{ vars.MUSA_CI_RUNTIME }}
          MUSA_CI_PHYSICAL_DEVICES: ${{ vars.MUSA_CI_PHYSICAL_DEVICES }}
          MUSA_CI_LOGICAL_DEVICES: ${{ vars.MUSA_CI_LOGICAL_DEVICES }}
          MUSA_CI_PCI_BUS_IDS: ${{ vars.MUSA_CI_PCI_BUS_IDS }}
          MUSA_CI_EMPTY_WHEEL: ${{ vars.MUSA_CI_EMPTY_WHEEL }}
          MUSA_CI_EMPTY_WHEEL_SHA256: ${{ vars.MUSA_CI_EMPTY_WHEEL_SHA256 }}
          MUSA_GATE_MODEL_27B: ${{ vars.MUSA_GATE_MODEL_27B }}
          MUSA_GATE_MODEL_35B_A3B: ${{ vars.MUSA_GATE_MODEL_35B_A3B }}
          MUSA_CI_IMAGE: ${{ vars.MUSA_CI_IMAGE }}
          MUSA_CI_DEPENDENCY_PROFILE: ${{ vars.MUSA_CI_DEPENDENCY_PROFILE }}
          MUSA_CI_DEPENDENCY_MANIFEST: ${{ vars.MUSA_CI_DEPENDENCY_MANIFEST }}
          MUSA_CI_DEPENDENCY_MANIFEST_SHA256: ${{ vars.MUSA_CI_DEPENDENCY_MANIFEST_SHA256 }}
        run: python .github/scripts/load_config.py --platform ${{ inputs.platform }}
      - id: changes
        name: Detect changed files (PR only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} > /tmp/changed_files.txt
            echo "file=/tmp/changed_files.txt" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            cat /tmp/changed_files.txt
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "Push event — no filtering"
          fi
      - id: matrix
        run: |
          CHANGED_ARG=""
          if [ -n "${{ steps.changes.outputs.file }}" ]; then
            CHANGED_ARG="--changed-files ${{ steps.changes.outputs.file }}"
          fi
          python .github/scripts/generate_matrix.py \
            --platform ${{ inputs.platform }} \
            $CHANGED_ARG

  musa_suite:
    name: MUSA complete test suite
    needs: setup
    if: inputs.platform == 'musa'
    runs-on: ${{ fromJson(needs.setup.outputs.config).runner_labels }}
    # Keep the existing per-stage bounds and allow container teardown and report upload.
    timeout-minutes: 1440
    container:
      image: ${{ fromJson(needs.setup.outputs.config).ci_image }}
      volumes: ${{ fromJson(needs.setup.outputs.config).container_volumes }}
      options: ${{ fromJson(needs.setup.outputs.config).container_options }}
    env:
      VLLM_NO_USAGE_STATS: "1"
      MUSA_CI_E2E_MATRIX: ${{ needs.setup.outputs.e2e_matrix }}
      MUSA_CI_SUITE_IMAGE: ${{ fromJson(needs.setup.outputs.config).ci_image }}
    steps:
      - name: Set unique suite result directory
        run: |
          suite_root="${RUNNER_TEMP}/musa-suite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gate_root="${RUNNER_TEMP}/musa-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'MUSA_SUITE_ARTIFACT_DIR=%s\nMUSA_GATE_ARTIFACT_DIR=%s\nMUSA_CI_RESULT_ROOT=%s\n' "$suite_root" "$gate_root" "$gate_root" >> "$GITHUB_ENV"
          mkdir -p "$suite_root/unit" "$suite_root/functional" "$suite_root/benchmark"
      - uses: actions/checkout@v4
      - name: Check the actual allocated devices and native PCI mapping
        id: devices
        timeout-minutes: 5
        run: bash .github/scripts/musa/check.sh
      - name: Install the isolated committed candidate
        id: install
        timeout-minutes: 60
        run: bash .github/scripts/musa/setup.sh
      - name: Verify owned child cleanup without accelerator allocation
        timeout-minutes: 1
        run: |
          python -I -B .github/scripts/musa/tests/test_ci_serial.py
          python -I -B .github/scripts/musa/tests/test_gate_fail_closed.py
          python -I -B .github/scripts/musa/tests/test_native_admission_probe.py
          python -I -B .github/scripts/musa/tests/test_gate_entry_diagnostics.py
          python -I -B .github/scripts/musa/tests/test_preserve_reports.py
      - name: Verify native admission and RNG lifecycle
        id: native_admission
        timeout-minutes: 7
        run: >-
          python -I -B .github/scripts/musa/run_native_admission_probe.py
          --candidate-root "$GITHUB_WORKSPACE"
          --output-dir "$MUSA_SUITE_ARTIFACT_DIR/native-admission"
      - name: Run unit tests
        id: unit
        if: ${{ success() && steps.native_admission.outcome == 'success' && steps.native_admission.outputs.gpu_stages_safe == 'true' }}
        timeout-minutes: 361
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope unit
      - name: Run functional tests
        id: functional
        timeout-minutes: 16
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope functional
      - name: Run the existing E2E groups serially
        id: e2e
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope e2e
      - name: Run benchmark smoke tests
        id: benchmark
        if: ${{ success() && steps.e2e.outcome == 'success' && steps.e2e.outputs.gpu_stages_safe == 'true' }}
        timeout-minutes: 31
        run: python -I -B .github/scripts/musa/run_ci_stage.py --scope benchmark
      - name: Run both original Gate models in eager and graph modes
        id: gate
        if: >-
          ${{ success() &&
          steps.devices.outcome == 'success' && steps.install.outcome == 'success' &&
          steps.native_admission.outcome == 'success' && steps.native_admission.outputs.gpu_stages_safe == 'true' &&
          steps.unit.outcome == 'success' && steps.unit.outputs.gpu_stages_safe == 'true' &&
          steps.functional.outcome == 'success' && steps.functional.outputs.gpu_stages_safe == 'true' &&
          steps.e2e.outcome == 'success' && steps.e2e.outputs.gpu_stages_safe == 'true' &&
          steps.benchmark.outcome == 'success' && steps.benchmark.outputs.gpu_stages_safe == 'true' }}
        timeout-minutes: 500
        run: bash .github/scripts/musa/run-adaptation-gate.sh
      - name: Stage original diagnostic bytes without the disposable venv
        if: ${{ always() }}
        run: >-
          python -I -B .github/scripts/musa/preserve_reports.py
          --candidate-root "$GITHUB_WORKSPACE"
          --suite-root "$MUSA_SUITE_ARTIFACT_DIR"
          --install-root "${MUSA_CI_INSTALL_EVIDENCE:-}"
          --gate-root "$MUSA_GATE_ARTIFACT_DIR"
          --output-root "${RUNNER_TEMP}/musa-preserved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve diagnostics before large raw and wheel transfers
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: musa-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/musa-preserved-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics
          if-no-files-found: error
      - name: Preserve complete observer raw events independently
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: musa-observer-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/musa-preserved-${{ github.run_id }}-${{ github.run_attempt }}/observer-raw
          if-no-files-found: error
      - name: Preserve remaining ordinary wheels independently
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: musa-input-wheels-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/musa-preserved-${{ github.run_id }}-${{ github.run_attempt }}/wheels
          if-no-files-found: error

  notify:
    needs: [setup, musa_suite]
    if: ${{ always() && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_notify_feishu.yml
    with:
      platform: ${{ inputs.platform }}
      status: >-
        ${{ needs.musa_suite.result == 'success' && 'success'
            || (needs.setup.result == 'cancelled' || needs.musa_suite.result == 'cancelled')
               && 'cancelled'
               || 'failure' }}
