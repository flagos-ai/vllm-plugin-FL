# One-time baseline initialization using the reviewed candidate; do not merge this recovery branch.
name: Initialize native-sync comparison baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'flagos-ai/vllm-plugin-FL' && github.ref == 'refs/heads/codex/recover-forward-sync-bot-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: forward-sync-0.4-to-0.5
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2aa3a8069d8004bf7ad465fab5a208a485867983
          persist-credentials: false
      - name: Create the state-only baseline review PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const scope = {owner: 'flagos-ai', repo: 'vllm-plugin-FL'};
            const api = github.rest;
            const target = (await api.git.getRef({...scope, ref: 'heads/0.5.0-dev'})).data.object.sha;
            try {
              await api.repos.getContent({...scope, path: '.github/forward-sync-baseline.json', ref: target});
              core.info('The comparison baseline is already present; no runtime PR was created by this one-time action.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const excluded = (await api.repos.compareCommitsWithBasehead({
              ...scope, basehead: target + '...f6c1f92e59679ccf027b5336d15a3914214cb714',
            })).data;
            if (['behind', 'identical'].includes(excluded.status)) throw new Error('Target already contains excluded source ancestry; reconcile manually.');
            const sync = require('./.github/scripts/forward-sync.cjs');
            const result = await sync({github, context, core});
            if (result.status !== 'baseline-pr-required') throw new Error('Unexpected baseline initialization result.');
            await core.summary.addHeading('Native sync comparison baseline').addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
