# Reusable unit test workflow — platform-agnostic.
#
# Accepts platform config (image, labels, volumes, options) as inputs
# so it can run on any backend (CUDA, Ascend, etc.).
# Platform-specific dependencies are installed via .github/scripts/<platform>/setup.sh.

name: Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name (e.g., nvidia, ascend)"
        required: true
        type: string
      branch:
        description: "Immutable revision supplied by platform setup"
        required: false
        type: string
        default: ""
      device:
        description: "Optional device config and runner selection"
        required: false
        type: string
        default: ""
      ci_image:
        description: "Docker image for the test container"
        required: true
        type: string
      runner_labels:
        description: "JSON array of runner labels"
        required: true
        type: string
      container_volumes:
        description: "JSON array of volume mounts"
        required: false
        type: string
        default: "[]"
      container_options:
        description: "Docker container options string"
        required: false
        type: string
        default: ""
      upload_coverage:
        description: "Whether to upload coverage report"
        required: false
        type: boolean
        default: true

jobs:
  unit-tests:
    name: Unit tests (${{ inputs.platform }}${{ inputs.device && format(', {0}', inputs.device) || '' }})
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    container:
      image: ${{ inputs.ci_image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check device availability
        run: bash .github/scripts/${{ inputs.platform }}/check.sh

      - name: Verify Hopper runner
        if: inputs.platform == 'nvidia' && inputs.device == 'h20'
        run: |
          python - <<'PY'
          import torch

          capability = torch.cuda.get_device_capability()
          if capability[0] != 9:
              raise RuntimeError(f"Hopper unit job requires SM90, found {capability}")
          print(f"Hopper unit coverage: {torch.cuda.get_device_name()} SM{capability[0]}{capability[1]}")
          PY

      - name: Install project
        run: bash .github/scripts/${{ inputs.platform }}/setup.sh

      - name: Run unit tests
        shell: bash
        env:
          TEST_DEVICE: ${{ inputs.device }}
        run: |
          DEVICE_ARGS=()
          if [ -n "$TEST_DEVICE" ]; then
            DEVICE_ARGS=(--device "$TEST_DEVICE")
          fi
          python tests/run.py \
            --platform ${{ inputs.platform }} \
            "${DEVICE_ARGS[@]}" \
            --scope unit

      # Platform-applicable coverage caliber (plan 3.2 / tier-1): keep the raw
      # coverage-{platform}.json untouched (it is still uploaded as an artifact
      # below) and derive coverage-{platform}-applicable.json, which drops the
      # other vendors' directories and their exclusive branch lines in the
      # public hybrid files. kunlunxin switches the FlagCICD upload to this
      # caliber first for dashboard validation; other platforms keep the raw
      # full-scope report until the dashboard is verified.
      - name: Compute platform-applicable coverage
        id: applicable
        if: ${{ !cancelled() && hashFiles(format('coverage-{0}.json', inputs.platform)) != '' }}
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          python tools/coverage/platform_scope_report.py \
            --report coverage-${{ inputs.platform }}.json \
            --platform ${{ inputs.platform }} \
            --output coverage-${{ inputs.platform }}-applicable.json \
            --commit-sha "$SOURCE_SHA"
          # Surface the caliber numbers for dashboard cross-checking.
          APPLICABLE_TOTALS="$(python - <<'PY'
          import json
          with open("coverage-${{ inputs.platform }}-applicable.json", encoding="utf-8") as f:
              totals = json.load(f)["totals"]
          print(
              f"{totals['covered_lines']}/{totals['num_statements']} "
              f"({totals['percent_covered']}%)"
          )
          PY
          )"
          echo "applicable-caliber: ${{ inputs.platform }} platform-applicable coverage = $APPLICABLE_TOTALS"
          echo "Platform-applicable coverage (other vendors' directories + their exclusive branch lines excluded): **$APPLICABLE_TOTALS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}${{ inputs.device && format('-{0}', inputs.device) || '' }}
          path: |
            coverage-${{ inputs.platform }}.json
            coverage-${{ inputs.platform }}-applicable.json
            report-${{ inputs.platform }}.json

      - name: Upload coverage report to FlagCICD
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        with:
          backend_url: 'https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/'
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          # kunlunxin (validation platform): report the platform-applicable
          # caliber; everything else keeps the raw full-scope JSON.
          report_path: ${{ inputs.platform == 'kunlunxin' && format('coverage-{0}-applicable.json', inputs.platform) || format('coverage-{0}.json', inputs.platform) }}
          fail_on_error: 'false'
