name: Iluvatar adaptation gates
on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      branch:
        required: true
        type: string
jobs:
  gates:
    runs-on: ${{ fromJson(inputs.config).runner_labels }}
    timeout-minutes: 240
    container:
      image: ${{ fromJson(inputs.config).ci_image }}
      volumes: ${{ fromJson(inputs.config).container_volumes }}
      options: ${{ fromJson(inputs.config).container_options }}
    env:
      ILUVATAR_MODEL_27B: /data/models/Qwen/Qwen3.6-27B
      ILUVATAR_MODEL_35B: /data/models/Qwen/Qwen3.6-35B-A3B
      FLAGCX_PATH: ${{ vars.ILUVATAR_FLAGCX_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Record tested revision
        run: |
          mkdir -p ci-results/iluvatar-gates
          git rev-parse HEAD | tee ci-results/iluvatar-gates/commit.txt
      - name: Provision and validate FlagCX
        run: bash .github/scripts/iluvatar/install_flagcx.sh
      - name: Install exact EMPTY framework and plugin
        run: bash .github/scripts/iluvatar/setup.sh
      - name: All model/mode groups and request assertions
        run: bash .github/scripts/iluvatar/run_gates.sh
      - name: Preserve results even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iluvatar-adaptation-gates
          path: ci-results/iluvatar-gates/
          if-no-files-found: error
