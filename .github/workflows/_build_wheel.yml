name: Build Wheel

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # DEBUG PROBE (PR #594): wheel build+verify gutted to cut per-lure-round
      # latency (the built wheel is not consumed by the probe's platform jobs,
      # which install from source). Restore before any real use of this branch.
      - name: Install build tools
        run: echo "debug-probe build gutted"

      - name: Build package
        run: echo "debug-probe build gutted"

      - name: Verify wheel
        run: echo "debug-probe verify gutted"

      - name: Upload wheel
        if: inputs.upload-artifact
        run: echo "debug-probe upload gutted"
