# Supplementary coverage suite — idle-time execution (weekend windows).
#
# Runs the supplementary tests in tests/supplementary_tests/ on an NVIDIA
# A100 runner and produces, from ONE frozen revision:
#   1. core baseline       (existing unit + functional scopes)
#   2. supplementary-only  (tests/supplementary_tests/run.py)
#   3. combined            (statement-level union, same scope)
#   4. per-area reports    (tools/coverage/area_report.py)
#
# Deliberately independent of the PR pipeline: workflow_dispatch + a
# Sunday 06:00 UTC schedule that avoids the nightly (18:00 UTC daily) and
# weekly (18:00 UTC Sunday) runner contention windows. It registers no
# PR status and does not affect the ci-gate.

name: Supplementary Coverage

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to run against (default 0.5.0-dev)"
        required: false
        type: string
        default: "0.5.0-dev"
  schedule:
    # Sunday 06:00 UTC = Sunday 14:00 Beijing — after Saturday's nightly,
    # before Sunday's weekly (18:00 UTC) claims the same A100 pool.
    - cron: "0 6 * * 0"

concurrency:
  group: coverage-supplementary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supplementary-coverage:
    name: Supplementary coverage (nvidia, a100)
    runs-on: [self-hosted, Linux, X64, flagcicd-a100]
    container:
      image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.32.0-cuda-ci@sha256:02b65e788e4ce2352ff1f41099744c33e196707b36a2e68461f78bfbe799a884
      volumes:
        - /data:/data
      options: >-
        --privileged
        --gpus all
        --ipc=host
        --shm-size 64g
        --hostname vllm-plugin-fl
        --user root
        --env CUDA_VISIBLE_DEVICES
        --env VLLM_PLUGINS=fl
        --env USE_FLAGGEMS=1
        --env GEMS_VENDOR=nvidia
        --env USE_FLAGTUNE=0
        --env OMP_NUM_THREADS=1
        --env VLLM_USE_V2_MODEL_RUNNER=1
        --ulimit nofile=65535:65535

    timeout-minutes: 600

    steps:
      - name: Resolve frozen revision
        id: rev
        run: |
          BRANCH="${{ inputs.branch || '0.5.0-dev' }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout (frozen revision)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.branch }}
          # depth 0 so the exact SHA is recorded in reports
          fetch-depth: 0

      - name: Record revision metadata
        id: meta
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Frozen revision: $SHA"

      - name: Check device availability
        run: bash .github/scripts/nvidia/check.sh

      - name: Install project
        run: bash .github/scripts/nvidia/setup.sh

      - name: Record environment metadata
        run: |
          python - <<'PY'
          import json, platform, torch, pytest, coverage
          info = {
              "python": platform.python_version(),
              "torch": torch.__version__,
              "pytest": pytest.__version__,
              "coverage": coverage.__version__,
              "gpu": torch.cuda.get_device_name(0) if torch.cuda.is_available() else "none",
              "gpu_count": torch.cuda.device_count(),
          }
          with open("coverage-env.json", "w") as f:
              json.dump(info, f, indent=2)
          print(json.dumps(info))
          PY

      # ------------------------------------------------------------------
      # Phase 1 — core baseline (existing scopes, unchanged commands)
      # ------------------------------------------------------------------
      - name: Core baseline — unit scope
        run: python tests/run.py --platform nvidia --device a100 --scope unit

      - name: Core baseline — functional scope (appends into coverage-nvidia.json)
        run: python tests/run.py --platform nvidia --device a100 --scope functional

      - name: Snapshot core baseline
        run: |
          cp coverage-nvidia.json coverage-nvidia-core.json
          rm -f .coverage .coverage.*
          echo "core baseline snapshot saved"

      # ------------------------------------------------------------------
      # Phase 2 — supplementary-only
      # ------------------------------------------------------------------
      - name: Supplementary suite
        run: python tests/supplementary_tests/run.py --platform nvidia --device a100

      - name: Snapshot supplementary coverage
        run: |
          cp coverage-nvidia-supp.json coverage-nvidia-supp-only.json
          rm -f .coverage .coverage.*

      # ------------------------------------------------------------------
      # Phase 3 — combined + per-area reports
      # ------------------------------------------------------------------
      - name: Merge and report
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          python tools/coverage/merge_coverage.py \
            --baseline coverage-nvidia-core.json \
            --supplementary coverage-nvidia-supp-only.json \
            --output coverage-nvidia-combined.json \
            --scope tools/coverage/scope_nvidia.json \
            --commit-sha "$SHA"

          for TAG in core supp-only combined; do
            case "$TAG" in
              core) REPORT=coverage-nvidia-core.json ;;
              supp-only) REPORT=coverage-nvidia-supp-only.json ;;
              combined) REPORT=coverage-nvidia-combined.json ;;
            esac
            python tools/coverage/area_report.py \
              --report "$REPORT" \
              --scope tools/coverage/scope_nvidia.json \
              --tag "$TAG" \
              --output-json "coverage-nvidia-areas-$TAG.json" \
              --output-md "coverage-nvidia-areas-$TAG.md"
          done

          {
            echo "## Supplementary coverage run"
            echo ""
            echo "- frozen revision: \`${SHA}\`"
            echo "### Core baseline"
            cat coverage-nvidia-areas-core.md
            echo "### Supplementary only"
            cat coverage-nvidia-areas-supp-only.md
            echo "### Combined"
            cat coverage-nvidia-areas-combined.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-supplementary-nvidia
          path: |
            coverage-nvidia-core.json
            coverage-nvidia-supp-only.json
            coverage-nvidia-supp.json
            coverage-nvidia-combined.json
            coverage-nvidia-areas-core.json
            coverage-nvidia-areas-supp-only.json
            coverage-nvidia-areas-combined.json
            coverage-nvidia-areas-core.md
            coverage-nvidia-areas-supp-only.md
            coverage-nvidia-areas-combined.md
            coverage-env.json
            test-results-nvidia.xml
            test-results-nvidia.json
          retention-days: 90
