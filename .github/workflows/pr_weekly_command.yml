# Handler for /weekly slash command.
# Triggers the weekly CI workflow on the PR's head branch.
#
# Usage:
#   /weekly              — test all platforms on this PR's branch
#   /weekly cuda         — test only cuda platform
#   /weekly cuda main    — test only cuda on main branch
#
# Authorized users: collaborators with triage/write/maintain/admin.
name: PR /weekly Command

on:
  repository_dispatch:
    types: [weekly-command]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  trigger-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check commenter authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.client_payload.github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if echo "$perm" | grep -qE '^(admin|write|maintain|triage)$'; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$COMMENTER is not authorized (need triage or higher)"
          exit 1

      - name: Parse command arguments
        id: parse
        env:
          COMMAND_ARGS: ${{ github.event.client_payload.slash_command.args.unnamed.arg1 }}
          BRANCH_ARG: ${{ github.event.client_payload.slash_command.args.unnamed.arg2 }}
          PR_URL: ${{ github.event.client_payload.pull_request.html_url }}
        run: |
          set -euo pipefail
          platforms="${COMMAND_ARGS:-}"
          branch="${BRANCH_ARG:-}"
          if [ -z "$branch" ]; then
            branch=$(gh api "$PR_URL" --jq '.head.ref')
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Using branch: $branch, platforms: ${platforms:-all}"

      - name: React to comment (ack)
        if: always() && steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.client_payload.github.payload.comment.id }}/reactions \
            -f content='+1'

      - name: Trigger weekly workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.parse.outputs.branch }}" \
            --field "platforms=${{ steps.parse.outputs.platforms }}" \
            --field "branch=${{ steps.parse.outputs.branch }}"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.github.payload.issue.number }}
          COMMENTER: ${{ github.event.client_payload.github.actor }}
        run: |
          branch="${{ steps.parse.outputs.branch }}"
          platforms="${{ steps.parse.outputs.platforms }}"
          scope="${platforms:-all platforms}"
          if [ "${{ steps.auth.outcome }}" = "failure" ]; then
            body="⛔ @$COMMENTER is not authorized to trigger weekly CI (need triage or higher)."
          elif [ "${{ job.status }}" = "success" ]; then
            body="📅 Weekly CI triggered for **$scope** on branch \`$branch\` (requested by @$COMMENTER). See [Actions](${{ github.server_url }}/${{ github.repository }}/actions/workflows/weekly.yml)."
          else
            body="❌ Failed to trigger weekly CI (requested by @$COMMENTER). See [workflow log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
