# PR CI Workflow
#
# Stage design (PR labels narrow the hardware stages; default is full):
#   lint + build  — always run, no hardware required
#   no label      — full: functional + e2e + benchmark on routed platforms
#   ci-functional — functional only
#   ci-e2e        — functional + e2e smoke
#   ci-full       — full (explicit form of the default)
#
# Platform routing: diff-based — only platforms whose trigger_paths match the
# PR diff are tested. Changes to shared code (see global_trigger_paths in
# .github/configs/platforms.yml — vllm_fl/ python, tests/, benchmarks/,
# .github/scripts, etc.) trigger all enabled platforms.
#
# ci-gate is the single Required Status Check configured in branch protection.
# It aggregates lint, build, discover, and all platform test results; a
# discovery failure fails the gate even though the platform jobs it would
# have spawned show as skipped. Skipped platform tests (no matching runner,
# no label) count as passing.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Lint (ruff check, ruff format, typos)
  # ============================================================
  lint:
    if: |
      github.event_name != 'pull_request' ||
      (
        github.repository == 'flagos-ai/vllm-plugin-FL' &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, 'WIP') &&
        !contains(github.event.pull_request.title, 'wip')
      )
    uses: ./.github/workflows/_lint.yml

  # ============================================================
  # Job 2: Build & install check
  # ============================================================
  build:
    needs: lint
    uses: ./.github/workflows/_build_wheel.yml

  # ============================================================
  # Job 3: Discover which platforms to test (diff-based routing)
  # ============================================================
  discover:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
      # Stage selection from PR labels. Default (no tier label) and
      # workflow_dispatch run the full stack; tier labels narrow it:
      # ci-functional = functional only, ci-e2e adds e2e smoke, ci-full
      # keeps the full stack (explicit).
      run_e2e: ${{ github.event_name == 'workflow_dispatch' || !(contains(github.event.pull_request.labels.*.name, 'ci-functional') || contains(github.event.pull_request.labels.*.name, 'ci-e2e') || contains(github.event.pull_request.labels.*.name, 'ci-full')) || contains(github.event.pull_request.labels.*.name, 'ci-e2e') || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
      run_benchmark: ${{ github.event_name == 'workflow_dispatch' || !(contains(github.event.pull_request.labels.*.name, 'ci-functional') || contains(github.event.pull_request.labels.*.name, 'ci-e2e') || contains(github.event.pull_request.labels.*.name, 'ci-full')) || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/configs
            .github/scripts
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              ${{ github.event.pull_request.base.sha }}...${{ github.sha }} \
              > /tmp/changed_files.txt
            echo "file=/tmp/changed_files.txt" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            cat /tmp/changed_files.txt
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — no diff filtering"
          fi
      - id: detect
        run: |
          CHANGED_ARG=""
          if [ -n "${{ steps.changed.outputs.file }}" ]; then
            CHANGED_ARG="--changed-files ${{ steps.changed.outputs.file }}"
          fi
          python3 .github/scripts/detect_platforms.py $CHANGED_ARG

  # ============================================================
  # Job 4a–4h: Platform tests (PR stage)
  # Require ci-functional, ci-e2e, or ci-full label to run on PRs.
  # workflow_dispatch bypasses the label check so manual runs always
  # execute all enabled platforms.
  # Skipped jobs (no label or no matching runner) do not fail ci-gate.
  # ============================================================
  test-nvidia:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'nvidia')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: nvidia
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-ascend:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'ascend')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: ascend
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-hygon:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'hygon')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: hygon
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-metax:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'metax')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: metax
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-musa:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'musa')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: musa
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-enflame:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'enflame')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: enflame
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-kunlunxin:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'kunlunxin')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: kunlunxin
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-thead:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'thead')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: thead
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  test-iluvatar:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'iluvatar')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: iluvatar
      ci_stage: pr
      run_e2e: ${{ fromJson(needs.discover.outputs.run_e2e) }}
      run_benchmark: ${{ fromJson(needs.discover.outputs.run_benchmark) }}
    secrets: inherit

  # ============================================================
  # ci-gate — single Required Status Check for branch protection.
  #
  # Rules:
  #   lint, build, discover : must be 'success'
  #   platform test jobs    : 'success' or 'skipped' → pass
  #                           'failure' or 'cancelled' → fail
  # ============================================================
  ci-gate:
    name: ci-gate
    needs:
      - lint
      - build
      - discover
      - test-nvidia
      - test-ascend
      - test-hygon
      - test-metax
      - test-musa
      - test-enflame
      - test-kunlunxin
      - test-thead
      - test-iluvatar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check gate
        env:
          LINT_RESULT:       ${{ needs.lint.result }}
          BUILD_RESULT:      ${{ needs.build.result }}
          DISCOVER_RESULT:   ${{ needs.discover.result }}
          NVIDIA_RESULT:      ${{ needs.test-nvidia.result }}
          ASCEND_RESULT:     ${{ needs.test-ascend.result }}
          HYGON_RESULT:      ${{ needs.test-hygon.result }}
          METAX_RESULT:      ${{ needs.test-metax.result }}
          MUSA_RESULT:       ${{ needs.test-musa.result }}
          ENFLAME_RESULT:    ${{ needs.test-enflame.result }}
          KUNLUNXIN_RESULT:  ${{ needs.test-kunlunxin.result }}
          THEAD_RESULT:      ${{ needs.test-thead.result }}
          ILUVATAR_RESULT:   ${{ needs.test-iluvatar.result }}
        run: |
          set -euo pipefail

          fail=0

          check_required() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name must succeed but got: $result"
              fail=1
            fi
          }

          check_optional() {
            local name="$1" result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name failed with: $result"
                fail=1
                ;;
            esac
          }

          check_required "lint"    "$LINT_RESULT"
          check_required "build"   "$BUILD_RESULT"
          # Discover must succeed: its failure skips every platform job,
          # and skipped platform jobs must not paper over a dead router.
          check_required "discover" "$DISCOVER_RESULT"

          check_optional "test-nvidia"    "$NVIDIA_RESULT"
          check_optional "test-ascend"    "$ASCEND_RESULT"
          check_optional "test-hygon"     "$HYGON_RESULT"
          check_optional "test-metax"     "$METAX_RESULT"
          check_optional "test-musa"      "$MUSA_RESULT"
          check_optional "test-enflame"   "$ENFLAME_RESULT"
          check_optional "test-kunlunxin" "$KUNLUNXIN_RESULT"
          check_optional "test-thead"     "$THEAD_RESULT"
          check_optional "test-iluvatar"  "$ILUVATAR_RESULT"

          if [ $fail -ne 0 ]; then
            echo "ci-gate: FAILED"
            exit 1
          fi
          echo "ci-gate: PASSED"
