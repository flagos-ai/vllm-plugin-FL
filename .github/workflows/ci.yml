# Temporary manual diagnostics on this isolated branch; never a PR Gate.
name: Iluvatar allocator phase1 probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iluvatar-allocator-phase1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-runner:
    if: github.ref == 'refs/heads/codex/iluvatar-ci-runner-probe-20261121'
    runs-on: [iluvatar-cicd-vllm-plugin]
    timeout-minutes: 5
    steps:
      - name: Probe owned allocator and read selected metadata
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_ATTEMPT: ${{ github.run_attempt }}
          PROBE_OUTPUT: ${{ runner.temp }}/iluvatar-phase1-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          python3 - <<'PY'
          """Bounded allocator probe; mutate only the uniquely marked network we create."""

          import json
          import os
          import re
          import socket
          import subprocess
          import time
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          INFO = '{"name":{{json .Name}},"id":{{json .ID}},"version":{{json .ServerVersion}}}'
          CONTAINER = (
              '{"id":{{json .Id}},"name":{{json .Name}},"mode":{{json .HostConfig.NetworkMode}},'
              '"networks":[""{{range $k,$v := .NetworkSettings.Networks}},'
              '{"name":{{json $k}},"id":{{json $v.NetworkID}}}{{end}}]}'
          )
          NETWORK = (
              '{"id":{{json .Id}},"name":{{json .Name}},"created":{{json .Created}},'
              '"driver":{{json .Driver}},"endpoints":{{len .Containers}},'
              '"subnets":[""{{range .IPAM.Config}},{{json .Subnet}}{{end}}],'
              '"keys":[""{{range $k,$v := .Labels}}{{if eq (len $k) 6}},{{json $k}}{{end}}{{end}}]}'
          )
          OWN_NETWORK = NETWORK[:-1] + ',"task":{{json (index .Labels "codex.task")}}}'
          OLD = {
              "7e3d405f94a726b3cd2805b0af6db293162c20a9b8c161fc69f3a1d6985dd283": "github_network_25c0bfd2c8234213b3f6455aa6246c22",
              "6a7645cd47b7d2ec25512eaf25c53c3bc33e44120b7a4e1999ef8fa905005af0": "github_network_587bc092196e4096b824e26b24d8ec35",
              "c55a87a5fa4664fa98ef7dce3f18c9353ba091a83790fbcacd84e5528dfc3554": "github_network_836727bcc4d04a9c8f61f23ec65a7388",
              "93a25811bba970af27dc91c92d8b16ea6788863f4d8c1f49254a4121fbbb24b6": "github_network_ecd94c99b97c40d3aaf3558425ad4808",
          }
          END = time.monotonic() + 120


          def scrub(text):
              text = re.sub(r"(https?://)[^/\s@]+@", r"\1<redacted>@", text)
              text = re.sub(
                  r"(?i)(authorization\s*[:=]\s*)(?:Basic|Bearer)\s+\S+", r"\1<redacted>", text
              )
              return re.sub(
                  r"(?i)\b(password|passwd|token|authorization)\s*[:=]\s*\S+",
                  r"\1=<redacted>",
                  text,
              )


          def run(args):
              remaining = END - time.monotonic()
              if remaining <= 0:
                  return {"ok": False, "status": "budget_exhausted", "stdout": "", "stderr": ""}
              try:
                  result = subprocess.run(
                      args, capture_output=True, text=True, timeout=min(10, remaining)
                  )
                  return {
                      "ok": result.returncode == 0,
                      "returncode": result.returncode,
                      "stdout": result.stdout,
                      "stderr": scrub(result.stderr)[:2000],
                  }
              except (subprocess.TimeoutExpired, OSError) as exc:
                  return {
                      "ok": False,
                      "status": type(exc).__name__,
                      "stdout": "",
                      "stderr": scrub(str(exc))[:500],
                  }


          def data(args):
              result = run(args)
              if not result["ok"]:
                  raise RuntimeError(
                      json.dumps({k: v for k, v in result.items() if k != "stdout"})
                  )
              return json.loads(result["stdout"])


          def ids(args):
              result = run(args)
              values = result["stdout"].splitlines()
              if (
                  not result["ok"]
                  or len(values) != len(set(values))
                  or any(not re.fullmatch(r"[a-f0-9]{64}", item) for item in values)
              ):
                  raise RuntimeError(
                      "Incomplete ID listing: "
                      + json.dumps({k: v for k, v in result.items() if k != "stdout"})
                  )
              return sorted(values)


          def own_probe(report, daemon, run_id, attempt):
              name = f"codex-iluvatar-phase1-{run_id}-{attempt}-{uuid.uuid4().hex[:12]}"
              label = "codex.task=" + name
              label_list = [
                  "docker",
                  "network",
                  "ls",
                  "--no-trunc",
                  "--quiet",
                  "--filter",
                  "label=" + label,
              ]
              name_list = [
                  "docker",
                  "network",
                  "ls",
                  "--no-trunc",
                  "--quiet",
                  "--filter",
                  "name=^" + name + "$",
              ]
              report.update(
                  name=name, task_label=name, create_attempted=False, old_network_mutations=False
              )
              if ids(label_list) or ids(name_list):
                  raise RuntimeError(
                      "Unique task network identity already exists; no mutation allowed"
                  )
              if END - time.monotonic() < 90:
                  report["outcome"] = "NOT_ATTEMPTED_BUDGET"
                  return report
              report["create_attempted"] = True
              created = run(
                  ["docker", "network", "create", "--driver", "bridge", "--label", label, name]
              )
              report["create"] = created
              task_ids = ids(label_list)
              if not task_ids:
                  report["absence_proven"] = (
                      not created["ok"]
                      and not ids(name_list)
                      and data(["docker", "info", "--format", INFO]) == daemon
                  )
                  report["outcome"] = (
                      "DEFAULT_POOL_EXHAUSTED"
                      if "could not find an available, non-overlapping IPv4 address pool"
                      in created["stderr"]
                      else "CREATE_FAILED_NO_TASK_NETWORK"
                      if not created["ok"]
                      else "CREATE_RESPONSE_INCONSISTENT"
                  )
                  return report
              if len(task_ids) != 1:
                  raise RuntimeError(
                      "More than one exact task-labelled network; no removal allowed"
                  )
              network_id = task_ids[0]
              report["created_id"] = network_id
              report["ownership_origin"] = (
                  "create_stdout"
                  if created["ok"]
                  else "exact_task_label_and_name_after_empty_preflight"
              )
              if created["ok"] and created["stdout"].strip() != network_id:
                  raise RuntimeError("Created network ID disagrees with exact task listing")
              if network_id in OLD or data(["docker", "info", "--format", INFO]) != daemon:
                  raise RuntimeError("Daemon or network identity changed; no removal allowed")
              network = data(
                  ["docker", "network", "inspect", "--format", OWN_NETWORK, network_id]
              )
              network["keys"] = [
                  value for value in network["keys"] if re.fullmatch(r"[0-9a-fA-F]{6}", value)
              ]
              report["before_remove"] = network
              if not (
                  network["id"] == network_id
                  and network["name"] == name
                  and network.get("task") == name
                  and network["driver"] == "bridge"
                  and network["endpoints"] == 0
              ):
                  raise RuntimeError(
                      "Task network ownership/zero-endpoint guard rejected removal"
                  )
              # No force/prune: a concurrent attachment makes Docker reject this exact-ID removal.
              report["remove"] = run(["docker", "network", "rm", network_id])
              report["absence_proven"] = (
                  not ids(label_list)
                  and not ids(name_list)
                  and data(["docker", "info", "--format", INFO]) == daemon
              )
              report["outcome"] = (
                  "ALLOCATOR_NORMAL_TASK_REMOVED"
                  if created["ok"] and report["absence_proven"]
                  else "CREATE_ERROR_TASK_REMOVED"
                  if report["absence_proven"]
                  else "INCOMPLETE_TASK_CLEANUP"
              )
              return report


          def snapshot():
              container_ids = ids(["docker", "ps", "--all", "--quiet", "--no-trunc"])
              containers = []
              if container_ids:
                  result = run(
                      ["docker", "container", "inspect", "--format", CONTAINER, *container_ids]
                  )
                  if not result["ok"]:
                      raise RuntimeError("Container reference inspection failed")
                  for line in result["stdout"].splitlines():
                      row = json.loads(line)
                      containers.append(
                          {
                              "id": row["id"],
                              "name": row["name"],
                              "mode": row["mode"],
                              "networks": sorted(
                                  [item for item in row["networks"] if isinstance(item, dict)],
                                  key=lambda x: (x["name"], x["id"]),
                              ),
                          }
                      )
                  if sorted(item["id"] for item in containers) != container_ids:
                      raise RuntimeError("Container ID set incomplete or changed during inspect")
              networks = {}
              for network_id in OLD:
                  result = run(["docker", "network", "inspect", "--format", NETWORK, network_id])
                  if result["ok"]:
                      row = json.loads(result["stdout"])
                      row["subnets"] = [value for value in row["subnets"] if value]
                      row["keys"] = sorted(
                          value for value in row["keys"] if re.fullmatch(r"[0-9a-fA-F]{6}", value)
                      )
                      networks[network_id] = row
                  else:
                      networks[network_id] = {
                          "unavailable": {k: v for k, v in result.items() if k != "stdout"}
                      }
              return {
                  "container_ids": container_ids,
                  "containers": sorted(containers, key=lambda x: x["id"]),
                  "networks": networks,
              }


          def references(containers, network_id, network_name):
              by_id = {item["id"]: item for item in containers}

              def visit(item, seen):
                  if item["id"] in seen:
                      raise ValueError("Container network-mode cycle")
                  mode = item["mode"]
                  direct = mode in (network_id, network_name) or any(
                      child.get("id") == network_id or child.get("name") == network_name
                      for child in item["networks"]
                  )
                  if mode.startswith("container:"):
                      target = mode.split(":", 1)[1]
                      matches = [
                          other
                          for other in by_id.values()
                          if other["id"] == target or other["name"].lstrip("/") == target
                      ]
                      if len(matches) != 1:
                          raise ValueError("Unresolved container network-mode reference")
                      direct = direct or visit(matches[0], seen | {item["id"]})
                  return direct

              return [item["id"] for item in containers if visit(item, set())]


          def main():
              report = {
                  "observed_at_utc": datetime.now(timezone.utc).isoformat(),
                  "hostname": socket.gethostname(),
                  "uid": os.getuid(),
                  "runner": os.environ.get("RUNNER_NAME"),
                  "diagnostic_only": True,
                  "gate_result_claimed": False,
                  "old_network_cleanup_authorized": False,
                  "original_failure_host_attributed": False,
                  "budget_seconds": 120,
                  "eligible_candidates": [],
              }
              try:
                  run_id, attempt = os.environ["PROBE_RUN_ID"], os.environ["PROBE_ATTEMPT"]
                  if not re.fullmatch(r"\d+", run_id) or not re.fullmatch(r"\d+", attempt):
                      raise ValueError("Run/attempt identifiers must be numeric")
                  before = report["daemon_before"] = data(["docker", "info", "--format", INFO])
                  if not all(
                      isinstance(before.get(key), str) and before[key] for key in ("name", "id")
                  ):
                      raise ValueError(
                          "Daemon name and ID must both be available before allocation"
                      )
                  allocator = report["allocator"] = {}
                  own_probe(allocator, before, run_id, attempt)
                  first = report["first"] = snapshot()
                  second = report["second"] = snapshot()
                  after = report["daemon_after"] = data(["docker", "info", "--format", INFO])
                  stable = bool(before.get("id")) and before == after and first == second
                  report["snapshot_stable"] = stable
                  if before != after:
                      allocator["outcome"] = "UNKNOWN_DAEMON_CHANGED"
                      allocator["absence_proven"] = False
                  candidates = []
                  report["candidate_assessments"] = {}
                  for network_id, name in OLD.items():
                      row = first["networks"][network_id]
                      if not (
                          stable
                          and allocator.get("absence_proven")
                          and before["name"] == "ub39"
                          and row.get("id") == network_id
                          and row.get("name") == name
                      ):
                          continue
                      created = datetime.fromisoformat(
                          re.sub(r"(\.\d{6})\d+", r"\1", row["created"]).replace("Z", "+00:00")
                      )
                      age = int((datetime.now(timezone.utc) - created).total_seconds())
                      refs = references(first["containers"], network_id, name)
                      report["candidate_assessments"][network_id] = {
                          "age_seconds_floor": age,
                          "referencing_container_ids": refs,
                      }
                      if (
                          age > 86400
                          and row["driver"] == "bridge"
                          and row["endpoints"] == 0
                          and row["keys"]
                          and not refs
                      ):
                          candidates.append(network_id)
                  report["eligible_candidates"] = candidates
              except Exception as exc:
                  report["incomplete"] = {
                      "type": type(exc).__name__,
                      "message": scrub(str(exc))[:1500],
                  }
              finally:
                  report["possible_task_network_remaining"] = bool(
                      report.get("allocator", {}).get("create_attempted")
                  ) and not report.get("allocator", {}).get("absence_proven", False)
                  output = Path(os.environ["PROBE_OUTPUT"])
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
                  print(
                      json.dumps(
                          {
                              key: report.get(key)
                              for key in (
                                  "diagnostic_only",
                                  "gate_result_claimed",
                                  "daemon_before",
                                  "allocator",
                                  "snapshot_stable",
                                  "eligible_candidates",
                                  "incomplete",
                              )
                          },
                          indent=2,
                      )
                  )
              return int(
                  "incomplete" in report
                  or not report.get("allocator", {}).get("absence_proven", False)
              )


          if __name__ == "__main__":
              raise SystemExit(main())

          PY

      - name: Retain allocator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iluvatar-phase1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iluvatar-phase1-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
