# Temporary manual diagnostics on this isolated branch; never a PR Gate.
name: Iluvatar runner read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iluvatar-readonly-runner-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-runner:
    if: github.ref == 'refs/heads/codex/iluvatar-ci-runner-probe-20261121'
    runs-on: [iluvatar-cicd-vllm-plugin]
    timeout-minutes: 5
    steps:
      - name: Read selected runner and Docker metadata
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          PROBE_OUTPUT: ${{ runner.temp }}/iluvatar-runner-probe-${{ github.run_id }}.json
        run: |
          python3 - <<'PY'
          """Read selected runner/daemon metadata; never change daemon or device state."""

          import json
          import os
          import re
          import shutil
          import socket
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          INFO = (
              '{"name":{{json .Name}},"server_version":{{json .ServerVersion}},'
              '"default_address_pools":{{json .DefaultAddressPools}}}'
          )
          PS = (
              '{"id":{{json .ID}},"name":{{json .Names}},'
              '"state":{{json .State}},"networks":{{json .Networks}}}'
          )
          NETWORK_LIST = '{"id":{{json .ID}},"name":{{json .Name}}}'
          NETWORK = (
              '{"id":{{json .Id}},"name":{{json .Name}},"created":{{json .Created}},'
              '"driver":{{json .Driver}},"endpoint_count":{{len .Containers}},'
              '"subnets":[""{{range .IPAM.Config}},{{json .Subnet}}{{end}}],'
              '"label_keys":[""{{range $k,$v := .Labels}}'
              "{{if eq (len $k) 6}},{{json $k}}{{end}}{{end}}]}"
          )
          END = time.monotonic() + 120


          def scrub(value):
              if isinstance(value, bytes):
                  value = value.decode(errors="replace")
              value = re.sub(r"(https?://)[^/\s@]+@", r"\1<redacted>@", value or "")
              value = re.sub(
                  r"(?i)\b(authorization\s*[:=]\s*)(?:Basic|Bearer)\s+\S+",
                  r"\1<redacted>",
                  value,
              )
              return re.sub(
                  r"(?i)\b(password|passwd|access_token|token)\s*[:=]\s*[^\s,;\"']+",
                  r"\1=<redacted>",
                  value,
              )


          def clean(value):
              if isinstance(value, dict):
                  return {k: clean(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [clean(v) for v in value]
              return scrub(value) if isinstance(value, str) else value


          def run(args):
              remaining = END - time.monotonic()
              if remaining <= 0:
                  return {"status": "probe_budget_exhausted", "stdout": "", "stderr": ""}
              started = time.monotonic()
              try:
                  result = subprocess.run(
                      args, capture_output=True, text=True, timeout=min(10, remaining)
                  )
                  return {
                      "status": "ok" if result.returncode == 0 else "command_failed",
                      "returncode": result.returncode,
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                      "stdout": result.stdout,
                      "stderr": scrub(result.stderr)[:3000],
                  }
              except subprocess.TimeoutExpired as exc:
                  return {
                      "status": "timeout",
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                      "stdout": scrub(exc.stdout),
                      "stderr": scrub(exc.stderr)[:3000],
                  }
              except OSError as exc:
                  return {"status": "unavailable", "stdout": "", "stderr": scrub(str(exc))[:1000]}


          def metadata(result):
              return {key: value for key, value in result.items() if key != "stdout"}


          def rows(result):
              return [json.loads(line) for line in result["stdout"].splitlines() if line.strip()]


          report = {
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "diagnostic_only": True,
              "gate_result_claimed": False,
              "hostname": socket.gethostname(),
              "uid": os.getuid(),
              "allowlisted_environment": {
                  name: os.environ.get(name) for name in ("RUNNER_NAME", "NODE_NAME")
              },
              "probe_budget_seconds": 120,
              "subprocess_timeout_max_seconds": 10,
          }
          try:
              result = run(["docker", "info", "--format", INFO])
              report["docker_info"] = metadata(result)
              if result["status"] == "ok":
                  data = json.loads(result["stdout"])
                  pools = data.get("default_address_pools")
                  report["docker_info"]["data"] = {
                      "name": data.get("name"),
                      "server_version": data.get("server_version"),
                      "default_address_pools": (
                          [{k: pool.get(k) for k in ("Base", "Size")} for pool in pools]
                          if isinstance(pools, list)
                          else None
                      ),
                  }

              result = run(["docker", "ps", "--all", "--no-trunc", "--format", PS])
              report["containers"] = metadata(result)
              report["containers"]["items"] = (
                  [
                      {key: row.get(key) for key in ("id", "name", "state", "networks")}
                      for row in rows(result)
                  ]
                  if result["status"] == "ok"
                  else []
              )

              result = run(
                  [
                      "docker",
                      "network",
                      "ls",
                      "--no-trunc",
                      "--filter",
                      "name=github_network_",
                      "--format",
                      NETWORK_LIST,
                  ]
              )
              report["github_networks"] = metadata(result)
              listed = rows(result) if result["status"] == "ok" else []
              listing_succeeded = result["status"] == "ok"
              report["github_networks"]["listed_count"] = len(listed)
              inspected = []
              for item in listed:
                  network_id = item.get("id", "")
                  if not re.fullmatch(r"[a-f0-9]{64}", network_id) or not str(
                      item.get("name", "")
                  ).startswith("github_network_"):
                      continue
                  result = run(["docker", "network", "inspect", "--format", NETWORK, network_id])
                  entry = {"listed_id": network_id, **metadata(result)}
                  if result["status"] == "ok":
                      data = json.loads(result["stdout"])
                      if data.get("id") != network_id or not str(data.get("name", "")).startswith(
                          "github_network_"
                      ):
                          raise ValueError("Network identity changed during the read-only sample")
                      entry["data"] = {
                          key: data.get(key)
                          for key in ("id", "name", "created", "driver", "endpoint_count")
                      }
                      entry["data"]["subnets"] = [
                          v for v in data.get("subnets", []) if isinstance(v, str) and v
                      ]
                      entry["data"]["runner_label_keys_6hex"] = [
                          v
                          for v in data.get("label_keys", [])
                          if isinstance(v, str) and re.fullmatch(r"[0-9a-fA-F]{6}", v)
                      ]
                  inspected.append(entry)
                  if result["status"] == "probe_budget_exhausted":
                      break
              report["github_networks"]["items"] = inspected
              report["github_networks"]["inspection_complete"] = (
                  listing_succeeded
                  and len(inspected) == len(listed)
                  and all(item["status"] == "ok" for item in inspected)
              )

              smi = shutil.which("ixsmi")
              if smi is None and os.access("/usr/local/corex-4.5.0/bin/ixsmi", os.X_OK):
                  smi = "/usr/local/corex-4.5.0/bin/ixsmi"
              if smi:
                  result = run([smi])
                  report["ixsmi_read_only"] = {
                      **metadata(result),
                      "stdout_excerpt": scrub(result["stdout"])[:20000],
                      "stdout_truncated": len(result["stdout"]) > 20000,
                  }
              else:
                  report["ixsmi_read_only"] = {"status": "not_available"}
          except Exception as exc:
              report["probe_exception"] = {
                  "type": type(exc).__name__,
                  "message": scrub(str(exc))[:1000],
              }
          finally:
              report = clean(report)
              output = Path(os.environ["PROBE_OUTPUT"])
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              print(
                  json.dumps(
                      {
                          "diagnostic_only": True,
                          "hostname": report["hostname"],
                          "uid": report["uid"],
                          "runner": report["allowlisted_environment"],
                          "docker_info": report.get("docker_info"),
                          "container_count": len(report.get("containers", {}).get("items", [])),
                          "github_network_count": report.get("github_networks", {}).get(
                              "listed_count"
                          ),
                          "network_inspection_complete": report.get("github_networks", {}).get(
                              "inspection_complete"
                          ),
                          "ixsmi_status": report.get("ixsmi_read_only", {}).get("status"),
                          "exception_type": report.get("probe_exception", {}).get("type"),
                      },
                      indent=2,
                  )
              )
          PY

      - name: Retain read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iluvatar-runner-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/iluvatar-runner-probe-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
