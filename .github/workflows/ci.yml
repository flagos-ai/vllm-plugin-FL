name: Iluvatar original CI recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iluvatar-original-ci-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: MetaX b1423592
    uses: flagos-ai/vllm-plugin-FL/.github/workflows/_platform_test.yml@b1423592f370551c3335d8d24e050d2cd3b36696
    with:
      platform: iluvatar
      ci_stage: pr
      branch: b1423592f370551c3335d8d24e050d2cd3b36696
      run_e2e: true
      run_benchmark: true

  sunrise:
    name: Sunrise a8d30618
    needs: baseline
    if: ${{ !cancelled() }}
    uses: flagos-ai/vllm-plugin-FL/.github/workflows/_platform_test.yml@b1423592f370551c3335d8d24e050d2cd3b36696
    with:
      platform: iluvatar
      ci_stage: pr
      branch: a8d306185adc24bee5f05ce60d74f224a0b3d493
      run_e2e: true
      run_benchmark: true
