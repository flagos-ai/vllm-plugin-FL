# Reusable benchmark smoke workflow.
#
# Runs lightweight benchmark smoke tests for vllm bench throughput,
# latency, and serve. These tests validate benchmark entrypoints and
# basic plugin integration, not performance regression.

name: Benchmark Smoke Test

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name (e.g., nvidia, ascend)"
        required: true
        type: string
      branch:
        description: "Branch/ref under test (empty = caller ref)"
        required: false
        type: string
        default: ""
      ci_image:
        description: "Docker image for the test container"
        required: true
        type: string
      runner_labels:
        description: "JSON array of runner labels"
        required: true
        type: string
      container_volumes:
        description: "JSON array of volume mounts"
        required: false
        type: string
        default: "[]"
      container_options:
        description: "Docker container options string"
        required: false
        type: string
        default: ""
      timeout:
        description: "Timeout for the job in minutes"
        required: false
        type: number
        default: 30
      ci_stage:
        description: "CI stage: pr / nightly / weekly"
        required: false
        type: string
        default: "nightly"
    secrets:
      FLAGCICD_API_TOKEN:
        required: false

jobs:
  benchmark-test:
    name: "Benchmark Smoke (${{ inputs.platform }})"
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: ${{ inputs.timeout }}
    container:
      image: ${{ inputs.ci_image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check device availability
        run: bash .github/scripts/${{ inputs.platform }}/check.sh

      - name: Install project
        run: bash .github/scripts/${{ inputs.platform }}/setup.sh

      - name: Run benchmark smoke tests
        run: |
          python tests/run.py \
            --platform ${{ inputs.platform }} \
            --scope benchmark \
            --stage ${{ inputs.ci_stage }} \
            --pytest-reports \
            --output-dir results/benchmark

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-${{ inputs.platform }}
          path: |
            results/benchmark/

      - name: Check FlagCICD authentication
        id: flagcicd
        if: ${{ !cancelled() && hashFiles('results/benchmark/pytest-reports.zip') != '' }}
        env:
          FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
        run: |
          if [ -n "${FLAGCICD_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FlagCICD upload skipped: FLAGCICD_API_TOKEN is unavailable (for example, on fork PRs). Reports remain in the artifact."
            echo "FlagCICD: upload skipped because credentials are unavailable; reports were retained as artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark test results to FlagCICD
        if: ${{ !cancelled() && steps.flagcicd.outputs.configured == 'true' && hashFiles('results/benchmark/pytest-reports.zip') != '' }}
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        with:
          backend_url: 'https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/'
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          report_path: 'results/benchmark/pytest-reports.zip'
          file_format: 'json'
          file_type: 'pytest'
          is_zipped: 'true'
          job_name: 'benchmark-${{ inputs.platform }}'
          fail_on_error: 'true'
