name: CI Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ci-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: |
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/ci run') ||
       startsWith(github.event.comment.body, '/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check maintainer authorization
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api \
            "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission')
          grep -qE '^(admin|write|maintain)$' <<<"$permission" || {
            echo "::error::$COMMENTER needs write, maintain, or admin permission"
            exit 1
          }
      - name: Checkout trusted command parser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/ci_command.py
          sparse-checkout-cone-mode: false
      - id: parse
        name: Parse command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          platforms=$(python .github/scripts/ci_command.py "$COMMENT_BODY")
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Dispatch immutable PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PLATFORMS: ${{ steps.parse.outputs.platforms }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "$DEFAULT_BRANCH" \
            --field "platforms=$PLATFORMS" \
            --field "pr_number=$PR_NUMBER"
      - name: Acknowledge and report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PLATFORMS: ${{ steps.parse.outputs.platforms }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='rocket'
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "🚀 CI requested for \`$PLATFORMS\` at the PR's current immutable head SHA."
      - name: Report rejected command
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "CI command was rejected or could not be dispatched. See [the command log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
