# Coverage ownership is intentionally separate from CI trigger routing in
# platforms.yml.  A trigger path says which jobs to run; this file says which
# backend directory under vendor_root belongs in a platform's coverage
# denominator.  Every platform in platforms.yml must be listed here.

vendor_root: vllm_fl/dispatch/backends/vendor

platforms:
  nvidia:
    backend: cuda
  ascend:
    backend: ascend
  # Hygon resolves to vendor/cuda (there is no vendor/hygon), but
  # CudaBackend.is_available() only accepts device_name=nvidia, so no vendor
  # backend can execute on Hygon.  Count shared code only until one exists.
  hygon:
    mode: shared_only
  metax:
    backend: metax
  musa:
    backend: musa
  enflame:
    backend: gcu
  kunlunxin:
    backend: kunlunxin
  thead:
    backend: thead
  iluvatar:
    backend: iluvatar
