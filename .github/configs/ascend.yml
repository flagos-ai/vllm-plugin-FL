# Ascend Hardware Configuration
# This file defines CI/CD settings for Ascend NPU testing

platform: ascend

# Docker image for this hardware.
# FlagOS Runtime 2.3.0 (CANN 9.0.0, Python 3.11) + vLLM 0.32.0+flagos +
# FlagGems-vllm (dev stage).
ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.32.0-ascend-dev

# Runner labels for this hardware
runner_labels:
  - flagcicd-910c

# Container volumes (hardware-specific paths)
container_volumes:
  - /usr/local/dcmi:/usr/local/dcmi
  - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
  - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
  - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver
  - /usr/local/sbin:/usr/local/sbin
  - /etc/ascend_install.info:/etc/ascend_install.info
  - /data:/data
  - /public-flash/models:/data/models/Qwen:ro

# Container options (hardware-specific settings)
# All runtime environment variables live here (not in setup.sh or the
# Dockerfile), matching the nvidia.yml layout from #785.
container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --privileged
  --env ASCEND_RT_VISIBLE_DEVICES=14,15
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800
  --env VLLM_PLUGINS=fl
  --env VLLM_FL_PLATFORM=ascend
  --env USE_FLAGGEMS=1
  --env GEMS_VENDOR=ascend
  --env VLLM_USE_V2_MODEL_RUNNER=1
  --env HF_ENDPOINT=https://hf-mirror.com
  --env FL_MODEL_BASE_PATH=/data/models
  --device /dev/davinci0
  --device /dev/davinci1
  --device /dev/davinci2
  --device /dev/davinci3
  --device /dev/davinci4
  --device /dev/davinci5
  --device /dev/davinci6
  --device /dev/davinci7
  --device /dev/davinci8
  --device /dev/davinci9
  --device /dev/davinci10
  --device /dev/davinci11
  --device /dev/davinci12
  --device /dev/davinci13
  --device /dev/davinci14
  --device /dev/davinci15
  --device /dev/davinci_manager
  --device /dev/devmm_svm
  --device /dev/hisi_hdc
