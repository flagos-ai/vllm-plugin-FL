# Iluvatar CoreX (BI-V150) CI configuration.
# The published image is the validated Iluvatar CI runtime and supplies the
# backend dependencies; CI only installs the checked-out plugin.
# Jobs need a self-hosted runner matching the label below.

platform: iluvatar
ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.32.0-iluvatar-ci
runner_labels:
  - iluvatar-cicd-vllm-plugin

container_volumes:
  - /data:/data
  - /dev:/dev
  - /lib/modules:/lib/modules
  - /usr/local/corex-4.5.0/lib64/libcuda.so.1:/usr/local/corex/lib64/libcuda.so.1
  - /usr/local/corex-4.5.0/lib64/libixml.so:/usr/local/corex/lib64/libixml.so
  - /usr/local/corex-4.5.0/bin/ixsmi:/usr/local/corex/bin/ixsmi
  - /mnt/share/user_homes/models:/data/models/Qwen:ro

container_options: >-
  --hostname vllm-plugin-fl
  --privileged
  --ipc=host
  --shm-size=64g
  --user root
  --ulimit nofile=65535:65535
  --env GEMS_VENDOR=iluvatar
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  --env VLLM_ENGINE_ITERATION_TIMEOUT_S=72000
  --env VLLM_RPC_TIMEOUT=72000000
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=7200
