# Iluvatar CoreX (BI-V150) CI configuration.
# Rebuilt 2026-11-04 from FlagOS runtime CoreX 4.5.0 version 2.3.0.
# Validated: unit tests and GPU/NCCL environment smoke checks.
# Build recipe: docker/iluvatar/Dockerfile.v0.28.0
# Jobs need a self-hosted runner matching the label below.

platform: iluvatar

ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.28.0-lluvatar-ci@sha256:58f1264a29737c0f5744233d895af55692013c2433258b5580b89b3b18a4cb1c

runner_labels:
  - iluvatar-cicd-vllm-plugin

# Keep the validated host model directory available at the paths shared by the
# existing Qwen cases.
container_volumes:
  - /data:/data
  - /dev:/dev
  - /lib/modules:/lib/modules
  - /usr/local/corex-4.5.0/lib64/libcuda.so.1:/usr/local/corex/lib64/libcuda.so.1
  - /usr/local/corex-4.5.0/lib64/libixml.so:/usr/local/corex/lib64/libixml.so
  - /mnt/share/user_homes/models:/data/models/Qwen

container_options: >-
  --hostname vllm-plugin-fl
  --privileged
  --ipc=host
  --shm-size=64g
  --env GEMS_VENDOR=iluvatar
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  --env VLLM_ENGINE_ITERATION_TIMEOUT_S=72000
  --env VLLM_RPC_TIMEOUT=72000000
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=7200
