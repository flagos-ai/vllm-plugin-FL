# Iluvatar CoreX (BI-V150) CI configuration.
# The published image is the validated Iluvatar CI runtime and supplies the
# backend dependencies; CI only installs the checked-out plugin.
# Jobs need a self-hosted runner matching the label below.

platform: iluvatar
ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.32.0-Iluvatar-ci@sha256:374c6775d470bd0866655ecf4da697f872d019e287719f1a5527c8e78944b0f3
runner_labels:
  - iluvatar-cicd-vllm-plugin

# The CoreX 5.0.1 runtime image carries its own driver userspace
# (libcuda.so.1, libixml.so, ixsmi) and requires a 5.0.1 host driver. Never
# inject the CoreX 4.5.0 libraries that the previous stack needed: they are
# ABI-incompatible with this runtime and make torch fail with ITR ioctl errors.
container_volumes:
  - /data:/data
  - /dev:/dev
  - /lib/modules:/lib/modules
  - /mnt/share/user_homes/models:/data/models/Qwen:ro

container_options: >-
  --hostname vllm-plugin-fl
  --privileged
  --ipc=host
  --shm-size=64g
  --user root
  --ulimit nofile=65535:65535
  --env GEMS_VENDOR=iluvatar
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  --env VLLM_ENGINE_ITERATION_TIMEOUT_S=72000
  --env VLLM_RPC_TIMEOUT=72000000
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=7200
