# MUSA Hardware Configuration
# This file defines CI/CD settings for MUSA testing.

platform: musa

# FlagOS 2.2 runtime base (flagos-runtime-mthreads-musa4.3.6:2.2.0) + vLLM 0.32.0 empty.
ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.32.0-musa-ci

runner_labels:
  - mt-cicd-vllm-plugin

container_volumes:
  - /data:/data:ro

# The image ships the vendor stack, the vLLM 0.32.0 empty wheel and the test
# tooling. The plugin itself and flaggems-vllm are installed from the checkout by
# .github/scripts/musa/setup.sh, which then asserts the pinned dependency tuple.
# GEMS_VENDOR selects the Mthreads kernels; VLLM_PLUGINS enables the FL plugin.
# This runner allocates host cards 4..7; the SDK sees their logical IDs 0..3.
# Keep both masks to preserve that allocation; see docs/usage/musa.md.
# Retain 64 GiB of shared memory with private IPC.
container_options: >-
  --hostname vllm-plugin-fl
  --runtime=mthreads
  --ipc=private
  --shm-size=64g
  --env GEMS_VENDOR=mthreads
  --env VLLM_PLUGINS=fl
  --env MTHREADS_VISIBLE_DEVICES=4,5,6,7
  --env MUSA_VISIBLE_DEVICES=0,1,2,3
