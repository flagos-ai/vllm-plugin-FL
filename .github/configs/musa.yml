# MUSA Hardware Configuration
# This file defines CI/CD settings for MUSA testing.

platform: musa

ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-musa-ci@sha256:8f865d2e2ee21e62b1c0c56f06079c072f9c2023d82fe7e240af4919fc75ce06

runner_labels:
  - mt-cicd-vllm-plugin

container_volumes:
  - /data:/data:ro

# The vLLM 0.28 image uses the native MUSA runtime without privileged mode.
# Keep the runner allocation explicit and retain 64 GiB with private IPC.
container_options: >-
  --hostname vllm-plugin-fl
  --runtime=mthreads
  --ipc=private
  --shm-size=64g
  --env GEMS_VENDOR=mthreads
  --env VLLM_PLUGINS=fl
  --env MTHREADS_VISIBLE_DEVICES=4,5,6,7
  --env MUSA_VISIBLE_DEVICES=0,1,2,3
