# Hygon Hardware Configuration
# This file defines CI/CD settings for Hygon DCU testing.

platform: hygon

# Docker image for this hardware.
# FlagOS Runtime 2.3.0 (DTK 26.10, Python 3.12) + vLLM 0.32.0+flagos +
# FlagGems-vllm (dev stage).
ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.32.0-hygon-dev

# Runner labels for this hardware.
runner_labels:
  - hg-cicd-vllm-plugin-0240

# Container volumes (hardware-specific paths).
container_volumes:
  - /opt/hyhal:/opt/hyhal:ro
  - /data:/data

# Container options (hardware-specific settings).
container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --device=/dev/kfd
  --device=/dev/mkfd
  --device=/dev/dri
  --group-add video
  --cap-add=SYS_PTRACE
  --security-opt seccomp=unconfined
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env GEMS_VENDOR=hygon
  --env TORCH_DEVICE_BACKEND_AUTOLOAD=0
  --env HF_ENDPOINT=https://hf-mirror.com
  --env FL_MODEL_BASE_PATH=/data/models
