# Hygon Hardware Configuration
# This file defines CI/CD settings for Hygon DCU testing.

platform: hygon

# Docker image for this hardware.
ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.24.0-hygon-ci

# Runner labels for this hardware.
runner_labels:
  - hg-cicd-vllm-plugin

# Container volumes (hardware-specific paths).
container_volumes:
  - /opt/hyhal:/opt/hyhal
  - /data:/data

# Container options (hardware-specific settings).
container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --device=/dev/kfd
  --device=/dev/mkfd
  --device=/dev/dri
  --group-add video
  --cap-add=SYS_PTRACE
  --security-opt seccomp=unconfined
