# Kunlunxin P800 OAM CI configuration.
# ci_image published 2026-10-13 (vLLM 0.28.0+empty + pytest CI deps):
#   harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-kunlunxin-ci
#   digest sha256:6e592dfcf4b729053aa029701c4cb300044df0a8231276a4e95f35cfa14b1eb8
# Jobs need a self-hosted runner matching the label below.

platform: kunlunxin

ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-kunlunxin-ci

runner_labels:
  - kunlunxin-p800

container_volumes:
  - /data:/data

container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --privileged
  --security-opt seccomp=unconfined
  --cap-add=SYS_PTRACE
  --ulimit memlock=-1
  --ulimit nofile=120000
  --ulimit stack=67108864
  --shm-size=128g
  --env GEMS_VENDOR=kunlunxin
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env FLAGCX_PATH=/workspace/FlagCX
  --env CUDA_VISIBLE_DEVICES=4,5,6,7
  --env VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800
