# Kunlunxin P800 OAM CI uses the unified CI image built on FlagOS Runtime 2.3.0
# by docker/kunlunxin/Dockerfile; the digest below is the published manifest.

platform: kunlunxin

ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:v0.32.0-kunlunxin-ci@sha256:3881b669a49dc70b4911b70c676f4ec976b3dba633311242f7edc1b42919ac2a

runner_labels:
  - kunlunxin-p800

container_volumes:
  - /data:/data

container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --privileged
  --security-opt seccomp=unconfined
  --cap-add=SYS_PTRACE
  --ulimit memlock=-1
  --ulimit nofile=120000
  --ulimit stack=67108864
  --shm-size=128g
  --env GEMS_VENDOR=kunlunxin
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env CUDA_VISIBLE_DEVICES=0,1,2,3
  --env VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800

# Run the dedicated unit job on the P800 runner (the functional job also runs
# the unit pass; this makes the unit result a first-class PR check).
unit_devices: [p800]
