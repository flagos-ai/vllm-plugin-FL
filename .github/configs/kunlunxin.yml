# Kunlunxin P800 OAM CI uses the published application image.
# setup.sh installs the same pinned vLLM runtime as the derived Docker image.

platform: kunlunxin

ci_image: harbor.baai.ac.cn/flagos-app/vllm0.24.0-kunlunxin-xre5.37.1:2.3.0-0.3.0@sha256:db1cceff13d438142abfd695500ac0820ebfe6ae13d909017a2ce073ac607b17

runner_labels:
  - kunlunxin-p800

container_volumes:
  - /data:/data

container_options: >-
  --hostname vllm-plugin-fl
  --ipc=host
  --privileged
  --security-opt seccomp=unconfined
  --cap-add=SYS_PTRACE
  --ulimit memlock=-1
  --ulimit nofile=120000
  --ulimit stack=67108864
  --shm-size=128g
  --env GEMS_VENDOR=kunlunxin
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env VLLM_FL_FLAGOS_WHITELIST=silu_and_mul,rms_norm,rotary_embedding
  --env CUDA_VISIBLE_DEVICES=0,1,2,3
  --env VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  --env VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800
