# vLLM-FL Dispatch Configuration for CUDA
# Auto-loaded when running on NVIDIA GPU hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
allow_vendors:
 - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - ascend

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:cuda   : CUDA-specific vendor backend
op_backends:
  attention_backend:
    - flagos
    - vendor
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference

# FlagOS operators known to be incompatible with the NVIDIA runtime.
# Keep this list evidence-based: add an operator only after a real inference
# failure has been reproduced and attributed to its FlagGems implementation.
flagos_blacklist:
  - index_put_
  - index_put
  - _index_put_impl_
  - nonzero
  - copy_
  - to_copy
  - index
  # FlagGems 5.4 pointwise kernels are incompatible with the PyTorch 2.13
  # runtime required by vLLM 0.28 (reproduced by Qwen3-8B V2 inference).
  - fill_scalar_
  - fill_tensor_
  - sub
  - rsub_scalar
  - masked_fill_
  - le
# OOT (Out-of-Tree) operator blacklist
# oot_blacklist: []
