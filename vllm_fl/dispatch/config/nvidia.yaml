# vLLM-FL Dispatch Configuration for CUDA
# Auto-loaded when running on NVIDIA GPU hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
allow_vendors:
 - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - ascend

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:cuda   : CUDA-specific vendor backend
op_backends:
  # DSV4 MHC requires the fused CUDA/TileLang implementation on NVIDIA.
  # Do not hide vendor kernel failures behind the materially different
  # FlagGems or PyTorch reference paths: fail at the vendor boundary instead.
  deepseek_v4_mhc_pre:
    - vendor:cuda
  deepseek_v4_mhc_pre_int8:
    - vendor:cuda
  deepseek_v4_mhc_fused_post_pre:
    - vendor:cuda
  deepseek_v4_mhc_fused_post_pre_int8:
    - vendor:cuda
  deepseek_v4_mhc_post:
    - vendor:cuda
  attention_backend:
    - flagos
    - vendor
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference
  indexer_k_quant_and_cache:
    - flagos
    - vendor:cuda
    - reference
  cp_gather_indexer_k_quant_cache:
    - flagos
    - vendor:cuda
    - reference
  top_k_per_row_prefill:
    - flagos
    - vendor:cuda
    - reference
  top_k_per_row_decode:
    - flagos
    - vendor:cuda
    - reference
  pack_seq_triton:
    - flagos
    - vendor:cuda
    - reference
  unpack_seq_triton:
    - flagos
    - vendor:cuda
    - reference
  # PR #5437's align kernel does not preserve padded -1 expert IDs after the
  # global-to-local EP map. Keep routing on vLLM CUDA for TP8/EP8.
  moe_align_block_size:
    - vendor:cuda
    - reference
  # Keep the reduction independently dispatchable. The vLLM CUDA wrapper
  # reaches aten::sum.out through the stable ABI, which is not compatible with
  # global FlagGems interception. Prefer FlagGems' Triton reduction here.
  moe_sum:
    - default.flagos
    - vendor:cuda
    - reference
  apply_rotary_emb:
    - flagos
    - vendor
    - reference

# FlagOS operator blacklist
flagos_blacklist:
  # FlagGems 5.3.4 cannot lower torch.float8_e8m0fnu allocations used by
  # DeepSeek-V4 FP8 UE8M0 scale parameters. Fall back to native PyTorch.
  - empty
  - index_put_
  - index_put
  - _index_put_impl_
  - nonzero
  - copy_
  - to_copy
  - index
  - cat
  - unfold
  # FlagGems linear autotuning can access invalid memory for dynamic shapes.
  - linear
  # FlagGems 5.4.0 Hopper mm.out retunes Inductor output-buffer GEMMs
  # across graph capture shapes, delaying cold server startup.
  - mm_out
# OOT (Out-of-Tree) operator blacklist
# oot_blacklist: []
