# vLLM-FL Dispatch Configuration for CUDA
# Auto-loaded when running on NVIDIA GPU hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
allow_vendors:
 - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - ascend

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:cuda   : CUDA-specific vendor backend
op_backends:
  attention_backend:
    - flagos
    - vendor
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference

# FlagOS operators known to be incompatible with the NVIDIA runtime.
# Keep this list evidence-based: add an operator only after a real inference
# failure has been reproduced and attributed to its FlagGems implementation.
flagos_blacklist:
  - index_put_
  - index_put
  - _index_put_impl_
  - nonzero
  - copy_
  - to_copy
  - index
  # The FlagGems 5.4 kernels below are incompatible with the PyTorch 2.13
  # runtime required by vLLM 0.28 (reproduced by Qwen3-8B and DeepSeek-V2).
  - fill_scalar_
  - fill_tensor_
  - sub
  - rsub_scalar
  - masked_fill_
  - le
  # MOSS-Transcribe-Diarize audio encoder/profile failures.
  - le_scalar
  - gelu
  - clamp
  # LLaVA-OneVision-2 visual encoder failures.
  # FlagGems filters by implementation function name, so scalar overloads
  # must be listed explicitly.
  - pow_scalar
  - pow_tensor_scalar
  - cos
  - sin
  - floor_divide
  # Qwen3.5 hybrid-attention and multimodal generation failures.
  - lt
  - lt_scalar
  - gt_scalar
  - rsqrt
  - sigmoid
  - where_self
  - where_self_out
  - true_divide_
  - bitwise_not
  - clamp_
  # Unlimited-OCR visual encoder/generation failures.
  - sqrt
  - sum
  - bitwise_or_tensor
  # LongCat-Flash-Lite scales loaded n-gram weights in place.
  - mul_
  # LongCat zero-expert routing and n-gram input preparation compare ids with scalars.
  - ge_scalar
  - eq_scalar
  # LongCat expands per-request n-gram state from tensor repeat counts.
  - repeat_interleave_self_tensor
  # LongCat V2 input preparation combines tensor masks during decode.
  - bitwise_and_tensor
  # DeepSeek-V2-Lite MLA/MoE and sampling failures.
  - reciprocal
  - mul
  - true_divide
  - repeat_interleave_self_int
  - neg
  - add
  - silu_and_mul
  - constant_pad_nd
  - pad
  - bmm_out
  - topk
  - full
  - gather
  - argmax
# FlagGems 5.4 fused MoE enters its internal pointwise activation kernel
# directly, bypassing the ATen-level flagos_blacklist, and fails on A800 with
# the PyTorch 2.13 runtime used by vLLM 0.28. Keep the rest of the FL OOT
# implementations enabled and delegate only fused MoE to native vLLM CUDA.
oot_blacklist:
  - fused_moe
