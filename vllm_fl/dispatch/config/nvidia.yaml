# vLLM-FL Dispatch Configuration for CUDA
# Auto-loaded when running on NVIDIA GPU hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
allow_vendors:
 - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - ascend

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:cuda   : CUDA-specific vendor backend
op_backends:
  attention_backend:
    - flagos
    - vendor
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference

# Operator-wide exclusions on the pinned FlagGems / FlagTree 3.6 stack.
# Current H100 probes reproduce a failing input/overload for every entry;
# these operator-wide exclusions also cover inputs that pass. The historical
# scatter_.src concurrent-model failure still needs separate revalidation.
flagos_blacklist:
  # FlagGems master (6fe7709e7717) with Triton 3.6 cannot lower E8M0
  # storage operations used by Humming MXFP8/MXFP4 scales. Keep the
  # native implementations for padding, scalar fill, and advanced indexing.
  - pad
  - constant_pad_nd
  - fill_scalar_
  - index
  # FlagGems master (6fe7709e) infers int64 for floating arange arguments without an
  # explicit dtype. NaViT position-bin boundaries then become all zeros,
  # corrupting MiniCPM-V 4.7 image and video embeddings.
  - arange_start
  # BF16 selection failed on A800; current H100 probes also reproduce wrong
  # values for strided BF16 input with the pinned FlagGems commit.
  - topk
  # Historical Gemma3n GQA head-layout failure; current FlagGems also rejects
  # the Torch 2.13 ATen enable_gqa keyword before executing this operation.
  - _scaled_dot_product_attention_math
  # Gemma3n AltUp compares a CUDA tensor with a CPU scalar tensor; FlagGems
  # requires both operands to be on the same device.
  - maximum
  # Gemma3n AltUp divides a CUDA tensor by a CPU scalar tensor; FlagGems passes
  # the CPU pointer to Triton and fails at runtime.
  - true_divide
  # The pinned implementation rejects scatter_.reduce; keep native overloads.
  # Historical Qwen3.6 multimodal batches use scatter_ to place features into the
  # token batch. FlagGems 5.3.5 can cross-wire those rows under concurrency,
  # producing outputs from another request or repeated punctuation on A800.
  - scatter_
# No NVIDIA OOT implementation is disabled without a reproduced model failure.
oot_blacklist: []
