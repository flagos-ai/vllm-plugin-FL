# vLLM-FL Dispatch Configuration for GCU (Enflame / torch_gcu)

prefer: flagos

strict: false

op_backends:
  attention_backend:
    - vendor:gcu
    - flagos
    - reference
  # Preserve the CUDA rounding contract through explicit vendor selection.
  rms_norm:
    - vendor:gcu
    - flagos
    - reference
  silu_and_mul:
    - vendor:gcu
    - flagos
    - reference
  rotary_embedding:
    - flagos
    - vendor:gcu
    - reference

flagos_blacklist:
  - scaled_dot_product_attention
  # The in-place wrapper delegates to the implementation op; keep both native.
  - index_put_
  - _index_put_impl_
  # FlagGems 5.4 exports only functional GCU mm. Its generic mm_out cannot
  # consume the Enflame SPLIT_K tuning config used by Inductor's out variant.
  - mm_out
  # FlagGems 5.5.0.dev0 rejects bool slices used by padding masks. Native
  # aten::slice is a zero-copy view and preserves storage aliasing for all dtypes.
  - slice
