# vLLM-FL Dispatch Configuration for Cambricon MLU (torch_mlu)
# Auto-loaded when running on Cambricon MLU hardware (vendor_name == "cambricon").
#
# There is no dedicated vendor/cambricon dispatch backend; ops route through
# FlagOS (flag_gems, Triton). Only per-op exceptions are listed below.

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# FlagOS operator blacklist
flagos_blacklist:
  # flag_gems `index` (cambricon backend, ops/index.py) crashes E2E inside the
  # vLLM inductor wrap: Triton's AutoTileForTritonPass fails with
  # "'tensor.expand_shape' op expected dimension 0 of collapsed type to be
  # static value of 4" during the flagtune bench of (15, 4096) shapes
  # (BLOCK_SIZE0=4 / BLOCK_SIZE1=4096). The RuntimeError escapes the autotuner
  # (not in its catch list), killing the EngineCore. Fall back to torch_mlu.
  - index

  # flag_gems `copy_` (cambricon backend) poisons the MLU device state on
  # neuware4.4.3 under vllm 0.20.2: the libentry cache-miss online timing bench
  # (triton do_bench reset-cache storm) runs on the LIVE decode tensors and
  # decode output degrades to mojibake on the cold first request. 4.4.3-only
  # (its older mlu triton do_bench); neuware4.7.2 is clean. Minimal set is
  # {copy_} — to_copy/fill/add/sub/fused-norm bench during requests but are
  # harmless. Fall back to torch_mlu. FlagGems root-cause fix pending
  # (libentry bench must not run on live inference tensors); keep while
  # transitional. End-to-end cold-start verified 2026-09-05 (c1–c7 chain).
  - copy_

  # flag_gems `native_layer_norm` runs on cambricon through the GENERIC wrapper
  # (src/flag_gems/ops/native_layer_norm.py): _FULL_CONFIG maps the aten op to
  # it, and the cambricon backend registers only layer_norm/layer_norm_backward
  # (_cambricon/ops/__init__.py), never native_layer_norm, so there is no
  # cambricon-local override to take the call. The wrapper then dispatches into
  # cambricon's layer_norm, whose contract differs from aten's in two ways: it
  # returns mean/rstd in `get_accumulator_dtype(input.dtype)` rather than input
  # dtype, and it receives the wrapper's stats_shape
  # (input.shape[:-len(normalized_shape)] + (1,) * len(normalized_shape)), a
  # broadcast shape the `layer_norm_kernel_middle_n` path (which takes a 1-D M)
  # does not fit. Fall back to torch_mlu. The flag_gems-side fix adds a
  # cambricon-local native_layer_norm wrapper, but it is unreleased (PR #5456 is
  # not an ancestor of any tag; configs.yaml pins flaggems 5.3.5), so keep this
  # entry until it ships.
  - native_layer_norm

  # NOTE: `empty` used to be blacklisted here (flag_gems grid 607744 > 65535
  # MLU Triton grid limit for the Qwen3 vocab embedding). The fix landed in
  # flag_gems 5.3.4 (_cambricon/ops/empty.py: grid capped at TOTAL_CORE_NUM +
  # grid-stride loop, PR #4435), so `empty` no longer needs a blacklist entry.
