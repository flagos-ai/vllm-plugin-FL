# vLLM-FL Dispatch Configuration for NVIDIA Hopper GPUs

# Opt-in via VLLM_FL_HOPPER_LONG_CONTEXT_OPT=1. This file replaces, rather
# than merges, nvidia.yaml. It mixes reproduced storage/dtype failures with
# inherited correctness and performance choices; it is not a proven minimal
# blacklist. Requalify the inherited choices on each new software stack.
prefer: flagos
strict: false

allow_vendors:
  - cuda

op_backends:
  # FlashAttention-3 is substantially faster than Triton unified attention
  # for long-context full-attention prefill on Hopper.
  attention_backend:
    - vendor
    - flagos
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference

flagos_blacklist:
  # FlagGems master (6fe7709e7717) with Triton 3.6 cannot lower E8M0
  # storage operations used by Humming MXFP8/MXFP4 scales. Keep the
  # native implementations for padding, scalar fill, and advanced indexing.
  - pad
  - constant_pad_nd
  - fill_scalar_
  # FlagGems master (6fe7709e) infers int64 for floating arange arguments without an
  # explicit dtype. NaViT position-bin boundaries then become all zeros,
  # corrupting MiniCPM-V 4.7 image and video embeddings.
  - arange_start
  # Inherited exclusions: current per-item correctness evidence is pending.
  - index_put_
  - index_put
  - _index_put_impl_
  - nonzero
  - copy_
  - to_copy
  # E8M0 advanced indexing has the same lowering failure as the storage ops.
  - index
  # Historical long-context projection performance policy. Fresh warmed
  # eager/graph timings are required before retaining or removing these.
  - mm
  - mm_out
