# T-Head PPU dispatch defaults.
# Site-specific validation policies can be supplied with VLLM_FL_CONFIG.
# Establish the FlagGems baseline first; vendor kernels remain optional fallbacks.

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - ascend

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:cuda   : CUDA-specific vendor backend
op_backends:
  mla_prefill: [flagos, vendor]
  bf16_indexer_cache_write: [flagos, vendor, reference]
  bf16_indexer_decode: [flagos, reference]
  # MLA query concatenation and cache writes belong to attention_backend.
  dynamic_per_token_quant_int8: [flagos, vendor, reference]
  moe_align_block_size: [flagos, vendor, reference]
  moe_sum: [flagos, vendor, reference]
  topk_softmax: [flagos, vendor, reference]
  grouped_topk: [flagos, vendor, reference]
  attention_backend:
    - flagos
    - vendor
    - reference
  rms_norm:
    - flagos
    - vendor
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - flagos
    - vendor
    - reference

# FlagOS operator blacklist
flagos_blacklist:
  - to_copy
  - _to_copy
  - zeros
  - copy_
  - fill_scalar_
  - sum_dim
  - exponential_
  - mm
  - resolve_neg
  - resolve_conj
  - eq_scalar
  - floor_divide
  - cumsum
  - mul
  - reciprocal
  - repeat
  - randn
  - add
  - ge_scalar
  - sub
  - bitwise_and
  - bitwise_not
  - slice_scatter
  - fill_tensor_
  - conv1d
  - conv2d
  - uniform_
  - prod
  - max
  - amax
  - cat
  - stack
  - flatten
  - reshape
  - view
  - tensor
  - topk
  - slice

# OOT (Out-of-Tree) operator blacklist
# oot_blacklist: []
