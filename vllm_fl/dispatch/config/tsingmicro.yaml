# vLLM-FL Dispatch Configuration for TSINGMICRO (TX8110 / TSM Runtime)
# Auto-loaded when running on TSINGMICRO txda hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
op_backends:
  # attention_backend: flagos (Triton attention) is CUDA-gated and raises on
  # txda, so fall back to vendor.txda -> AttentionFLBackend (flag_gems).
  # reference is not listed: its registration is broken upstream (missing
  # ReferenceBackend methods) and its impl returns CUDA-only FLASH_ATTN.
  attention_backend:
    - flagos
    - vendor
  # rms_norm/rotary_embedding: flag_gems (flagtree-compiled) kernels compute
  # WRONG values on TX8110 without raising (probe: rms_norm maxrel ~7200,
  # rope maxabs ~1.7-2.9 vs float32 ref), so reference-first: strict:false only
  # falls back on exception, and wrong output never triggers it. Reference.torch
  # impls are numerically fine on txda (maxrel < 1%, bf16 precision).
  rms_norm:
    - reference
    - flagos
  silu_and_mul:
    - flagos
    - reference
  rotary_embedding:
    - reference
    - flagos

# FlagOS operator blacklist
# to_copy/copy_/copy hang the TX8110 triton copy kernel on dtype-changing
# casts (e.g. int32 -> int64) in topk_topp sampling; mask these off.
flagos_blacklist:
  - masked_fill
  - masked_fill_
  - to_copy
  - copy_
  - copy

# OOT (Out-of-Tree) operator blacklist
oot_blacklist:
  - masked_fill
  - masked_fill_
