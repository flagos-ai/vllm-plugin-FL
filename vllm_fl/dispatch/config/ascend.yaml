# vLLM-FL Dispatch Configuration for Ascend NPU
# Auto-loaded when running on Ascend hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - ascend
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos       : Default FlagOS implementation
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:ascend : Ascend-specific vendor backend
op_backends:
  # attention_backend: prioritize vendor as FlagGems implementation is incomplete
  attention_backend:
    - vendor
    - flagos
    - reference
  rms_norm:
    - vendor
    - flagos
    - reference
  silu_and_mul:
    - flagos
    - vendor
    - reference
  rotary_embedding:
    - vendor
    - flagos
    - reference
  # invoke_fused_moe_triton_kernel: prioritize vendor (torch.mm) because
  # FlagGems Triton kernel overflows NPU unified buffer on some model shapes
  invoke_fused_moe_triton_kernel:
    - vendor
    - flagos
  # moe_align_block_size: prioritize vendor (pure-torch) because
  # FlagGems Triton kernel causes DDR address OOB on NPU
  moe_align_block_size:
    - vendor
    - flagos
  moe_sum:
    - vendor
    - flagos
  topk_softmax:
    - vendor
    - flagos

# FlagOS operator blacklist
# These operators will NOT use FlagOS implementation even if FlagOS is enabled.
flagos_blacklist:
  # index (advanced-index gather `tensor[idx]`): the FlagGems Triton index kernel
  # corrupts gathers on Ascend NPU (same NPU-indexing failure class as the GDN
  # ssm_state gather). The Qwen3-VL ViT 2D rotary gathers per-position cos/sin via
  # `cos[pos_ids]` / `sin[pos_ids]`; a corrupted gather scrambles the rotary
  # positions, so over the 27 ViT blocks the image embeddings lose fine spatial
  # detail -> OCR / thin shapes decode as garbage while coarse features survive.
  # The LLM rope uses the vendor rotary_embedding op (not aten index), so text is
  # unaffected. Fall back to torch (correct on NPU) for index.
  - index
  # exp / log: the FlagGems Triton exp/log kernels are imprecise AND slow on
  # Ascend NPU. The GDN linear-attention recurrent path applies the gated decay
  # `h *= exp(g)` once per timestep and computes the gate via exp/log (softplus),
  # so for a long prefill they run tens of thousands of times across the GDN
  # layers. The per-step error compounds and corrupts the recurrent state at long
  # context (35B begin-of-context retrieval degenerates), and the per-call Triton
  # launch overhead makes the prefill ~150x slower. The LLM softmax/attention use
  # vendor ops (not aten exp/log), so falling back to torch is correct and fast.
  - exp
  - log
  - masked_scatter_
  - masked_scatter
  - scatter_add_
  - ones
  - ones_like
  - isclose
  - allclose
  - mean_dim
  - chunk_gated_delta_rule_fwd
  - rsqrt # performance loss
  - index_select
  - true_divide
  - true_divide_
  - div
  - div_
  - silu
  - silu_and_mul # performance loss end
  - to_copy
  - _to_copy
  - zeros
  - acos
  - copy_
  - fill_scalar_
  - sum_dim
  - exponential_
  - mm
  - resolve_neg
  - resolve_conj
  - eq_scalar
  - floor_divide
  - cumsum
  - cumsum_out
  - mul
  - reciprocal
  - repeat
  - randn
  - add
  - ge_scalar
  - sub
  - bitwise_and
  - bitwise_not
  - slice_scatter
  - fill_tensor_
  - conv1d
  - conv2d
  - uniform_
  - prod
  - max
  - amax
  - cat
  - stack
  - flatten
  - reshape
