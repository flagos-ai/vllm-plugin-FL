# vLLM-FL Dispatch Configuration for Ascend NPU
# Auto-loaded when running on Ascend hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - ascend
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos       : Default FlagOS implementation
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:ascend : Ascend-specific vendor backend
op_backends:
  # attention_backend: prioritize vendor as FlagGems implementation is incomplete
  attention_backend:
    - vendor
    - flagos
    - reference
  rms_norm:
    - vendor
    - flagos
    - reference
  silu_and_mul:
    # Both implementations pass numerical tests; torch_npu has lower launch
    # latency. Prefer it without excluding the FlagGems fallback.
    - vendor
    - flagos
    - reference
  rotary_embedding:
    - vendor
    - flagos
    - reference
  grouped_moe_experts:
    - vendor:ascend
  w8a8_moe_experts:
    - vendor:ascend
    - flagos
    - reference

# Baseline exclusions originated with FlagGems 3b406c36 / FlagTree ascend3.5.
# The v2 empty-buffer exclusions below also cover the FlagGems 5.4 image.
# ATen exclusions use implementation function names, not torch schema names.
# Vendor-auto-excluded ops (to_copy, copy_, cat, exponential_) need no duplicate
# entry here. Performance preferences belong in op_backends above.
flagos_blacklist:
  # FlagGems 5.4 registers the ne_.Scalar/Tensor schemas twice, through
  # canonical ne_* and not_equal_* aliases. Exclude only the duplicate aliases;
  # the canonical scalar inequality kernel remains enabled.
  - not_equal_scalar_
  - not_equal_
  # The canonical tensor ne_ misreads stride-2 views (17/561 wrong values
  # on FlagGems 5.4). Preserve native in-place tensor comparisons.
  - ne_
  # qwen-vllm_for_ascend (3b406c36) wraps argmax twice with LibEntry,
  # failing sampler warmup with "Invalid Runtime Function". Use torch_npu.
  - argmax
  # FlagTree cannot lower pow(float32, int32) in FlagGems' tanh GELU.
  # Keep vision activation on the native torch_npu implementation.
  - gelu
  # FlagGems 5.4 corrupts the first row of the biased BF16 linear used
  # for Qwen3.6 vision patch projection (M=1900, K=1536, N=1152).
  - linear
  # FlagGems conv1d faults in Qwen3.6-27B's GDN prefill process with
  # 5120 groups, T=15, K=4, padding=3. Keep conv2d enabled: the
  # native conv1d path passes text/image serving with that override active.
  - conv1d
  # Qwen3.6-27B TP2 r2 plog identifies FlagGems 5.4's shared pad
  # kernel _pad_jit_function_1 (hash 17118823940470532360) as the
  # vector-core fault. Both registered entries use that implementation.
  - pad
  - constant_pad_nd
  # Mixed bool values in a stride-2 view are read incorrectly by the
  # pinned bitwise_not kernel, breaking native boolean indexing.
  - bitwise_not
  - bitwise_not_
  # FlagGems index_put cannot compile GDN's boolean state reset on Ascend.
  - index_put
  - index_put_
  - _index_put_impl_
  # FlagGems Ascend index assumes contiguous input and misreads the
  # strided cosine/sine cache used by Qwen vision RoPE (3b406c36).
  - index
  # FlagGems 5.4 index_copy_ corrupts scheduler copy-on-write rows and
  # overlapping dense-cache planes; the native int32 path passes the same cases.
  - index_copy_
  # FlagGems 5.4 index_fill_ fails to compile strided int32 cache planes.
  # Native index_fill_ preserves the overlapping-plane zero contract.
  - index_fill_
  # In-place masked scatter rejects noncontiguous tensors. Scatter variants
  # miscalculate strided offsets, including their CPU reduction fallback.
  - masked_scatter_
  - scatter_add_
  - scatter
  - scatter_
  # FlagGems 5.4 fresh-tensor copies launch a zero-sized grid for empty
  # construction temporaries (including vLLM attention scale initialization).
  # Native fresh/copy semantics also retain the required alias contract.
  - lift_fresh
  - lift_fresh_copy
  - lift_fresh_copy_out
  # v2 creates empty state buffers. These FlagGems 5.4 implementations
  # form zero-sized grids (or tl.arange(0, 0)); verified on the 910C stack.
  - zero_
  - full_like
  - arange
  - arange_start
  # Empty inputs cause zero-sized Triton blocks or invalid coreDim launches.
  - ones
  - ones_like
  - cumsum
  - cumsum_out
  - gather
  # Native randn delegates to normal_; both must stay native for empty shapes.
  - randn
  - normal_
  # Fill/uniform and negative/conjugate view implementations corrupt or
  # misread storage, including interleaved noncontiguous in-place views.
  - fill_scalar_
  - fill_tensor_
  - uniform_
  - resolve_neg
  - resolve_conj
  # Reduction / layout contracts: mean(dim=None) returns the wrong shape,
  # sum/prod do not promote integers, and amax/stack misread strided storage.
  - mean_dim
  - sum_dim
  - prod
  - amax
  - stack
  # rand/rand_like exceed the Ascend UB limit for a 257x257 FP32 tensor.
  - rand
  - rand_like
  # FlagGems in-place log_ drops the first 1024 elements for N >= 65536
  # (leaves them untouched). torch_npu builds exponential_ on top of log_,
  # and vLLM samples with probs / exponential_ + argmax, so a masked vocab
  # makes every sampled token id collapse to 0 -- greedy sampling is
  # unaffected, which hides the bug from argmax-only smoke tests.
  - log_
  # FlagGems FLA overflows UB at T=65, K=V=64. Keep the Ascend adapter for
  # vLLM's packed/GQA, v-first-state GDN contract.
  - chunk_gated_delta_rule_fwd

# OOT (Out-of-Tree) operator blacklist
# These operators will NOT be registered as OOT replacements.
# oot_blacklist:
#   - fused_moe
