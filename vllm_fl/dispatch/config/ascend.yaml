  - argmax
  - addmm
  # Additional ops blacklisted to avoid garbled text during long generation.
  # These FlagGems Triton kernels may produce subtly wrong results on Ascend NPU
  # which compound over 2048-token decodes.
  - bmm
  - where
  - embedding
  - gelu
  - gelu_
  - sigmoid
  - sigmoid_
  - tanh
  - pow
