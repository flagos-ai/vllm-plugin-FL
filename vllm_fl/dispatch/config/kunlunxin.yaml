# vLLM-FL Dispatch Configuration for Kunlunxin vendor
# Auto-loaded when running on Kunlunxin hardware

# Preferred default backend type: flaggems, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - kunlunxin
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : FlagOS implementation
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:kunlunxin : Kunlunxin-specific vendor backend
op_backends:
  # XPU FlagTree cannot compile upstream unified attention within the event limit.
  attention_backend:
    - vendor:kunlunxin

  # rms_norm: prioritize flagos (FlagGems) implementation, fallback to vendor
  rms_norm:
    - flagos
    - vendor
    - reference

  # silu_and_mul: prioritize flagos (FlagGems) implementation, fallback to vendor
  silu_and_mul:
    - flagos
    - vendor
    - reference

  # rotary_embedding: prioritize flagos (FlagGems) implementation, fallback to vendor
  rotary_embedding:
    - flagos
    - vendor
    - reference

  # FLA chunk gated delta rule: vendor (Kunlunxin) implementation
  chunk_gated_delta_rule_fwd:
    - vendor
    - reference

  # FLA fused recurrent gated delta rule: vendor (Kunlunxin) implementation
  fused_recurrent_gated_delta_rule_fwd:
    - vendor
    - reference

  # Causal conv1d forward: vendor (Kunlunxin) implementation
  causal_conv1d_fn:
    - vendor
    - reference

  # Causal conv1d update: vendor (Kunlunxin) implementation
  causal_conv1d_update:
    - vendor
    - reference

  fused_experts:
    - vendor:kunlunxin

  # Fused GDN gating: vendor (Kunlunxin) implementation
  fused_gdn_gating:
    - vendor
    - reference

flagos_blacklist:
  # Qwen3.6 vision RoPE uses scalar-base pow during model construction.
  # FlagTree 0.7 fails to lower the FlagGems P800 pow_scalar kernel.
  - pow_scalar
  # The FlagGems copy kernel requires the unavailable TLE UNI_SRAM API.
  # RoPE table concatenation calls copy_ internally during model startup.
  - copy_
  # Vision SDPA uses 72-wide heads that the FlagGems XPU matmul cannot lower.
  - _scaled_dot_product_attention_math
  # V2 KV buffers exceed the FlagTree int32 tile bound for both zeroing paths.
  - zeros
  - zero_
  # The XPU nonzero kernel faults on the dense bool grammar mask at warmup.
  - nonzero
  # Vocabulary-wide sampling reaches an XPU radix-sort kernel launch failure.
  - sort
  - sort_stable
  # FlagTree cannot lower the broadcast tensor comparison used for top-k.
  - lt

# OOT (Out-of-Tree) operator blacklist
# These operators will NOT be registered as OOT replacements.
# oot_blacklist:
#   - fused_moe
