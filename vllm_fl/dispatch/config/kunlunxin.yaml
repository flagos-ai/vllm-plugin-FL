# vLLM-FL Dispatch Configuration for Kunlunxin vendor
# Auto-loaded when running on Kunlunxin hardware

# Preferred default backend type: flaggems, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - kunlunxin
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : FlagOS implementation
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:kunlunxin : Kunlunxin-specific vendor backend
op_backends:
  # attention_backend: prioritize flagos (FlagGems Triton) implementation
  attention_backend:
    - flagos
    - vendor
    - reference

  # rms_norm: prioritize flagos (FlagGems) implementation, fallback to vendor
  rms_norm:
    - flagos
    - vendor
    - reference

  # silu_and_mul: prioritize flagos (FlagGems) implementation, fallback to vendor
  silu_and_mul:
    - flagos
    - vendor
    - reference

  # rotary_embedding: prioritize flagos (FlagGems) implementation, fallback to vendor
  rotary_embedding:
    - flagos
    - vendor
    - reference

  # FLA chunk gated delta rule: vendor (Kunlunxin) implementation
  chunk_gated_delta_rule_fwd:
    - vendor
    - reference

  # FLA fused recurrent gated delta rule: vendor (Kunlunxin) implementation
  fused_recurrent_gated_delta_rule_fwd:
    - vendor
    - reference

  # Causal conv1d forward: vendor (Kunlunxin) implementation
  causal_conv1d_fn:
    - vendor
    - reference

  # Causal conv1d update: vendor (Kunlunxin) implementation
  causal_conv1d_update:
    - vendor
    - reference

  # Fused GDN gating: vendor (Kunlunxin) implementation
  fused_gdn_gating:
    - vendor
    - reference

# FlagOS operator blacklist
# These operators will NOT use FlagOS implementation even if FlagOS is enabled.
flagos_blacklist:
  # --- FlagGems ATen ops known broken on this platform ---
  - _dirichlet_grad
  - _flash_attention_backward
  - _safe_softmax
  - _scaled_dot_product_attention_math
  - _scaled_dot_product_flash_attention_backward
  - argmax
  - bmm
  - index_put_
  # `aten::pow.Scalar` (kernel fn `pow_scalar`) with a float scalar base
  # (`2.0 ** tensor`, e.g. RotaryEmbedding._compute_inv_freq) crashes the
  # Kunlunxin Triton backend: `tl.exp2(y * lnb)` trips
  # "triton_xpu.unpack reached lowering without a bufPtr" in ConvertTritonXPUToLLVM.
  # FlagGems matches flagos_blacklist against the KERNEL FUNCTION name
  # (flag_gems/runtime/op_registrar.py: `item[1].__name__ not in self.exclude_ops`),
  # so the entry MUST be `pow_scalar`; plain `pow` has no effect.
  # Tensor-base forms (pow_tensor_scalar / pow_tensor_tensor) stay on FlagGems.
  - pow_scalar
  - normal_
  - copy_
  # `aten::_to_copy` (kernel fn `to_copy`) kills the Kunlunxin Triton backend
  # with `err_code: -714` (misaligned address) on the P800: during
  # `profile_run` the generated `_to_copy_contiguous_kernel` (Qwen3.6-27B eager)
  # and `_to_copy_func_close_interleave_kernel_rank_3` (Qwen3.6-35B-A3B, 3-D
  # non-contiguous RMSNorm input) both fail with
  # `xpuLaunchKernel ... Exception in kernel execution`, taking the EngineCore
  # down with an async "illegal memory access". A dtype cast has no reason to
  # use a generated kernel, so keep it on the vendor torch path.
  - to_copy
  # `aten::zero_` (kernel fn `zero_` in
  # flag_gems/runtime/backend/_kunlunxin/ops/zero.py) dispatches to the Triton
  # `_zero_fill_kernel_rank_1`, which faults with `err_code: -714` on the P800.
  # It is reached from the KV-block zeroing patch
  # (`kv.narrow(block_dim, ...).zero_()`), so the first
  # `POST /v1/chat/completions` killed all four TP workers and answered
  # HTTP 500.  Zeroing has no reason to use a generated kernel: keep
  # `aten::zero_` on the vendor ATen fill path.
  - zero_
  # `aten::min` (kernel fn `min` -> `min_kernel_1`) faults the same way
  # (`xpuLaunchKernel("min_kernel_1") ... err_code: -714`).  It was reached not
  # by model math but by `torch._tensor_str`, when vLLM's IR dispatcher
  # formatted a DEBUG log for the unsupported `rms_norm` provider argument --
  # so the *logging* inside `profile_run` took the engine down (35B-A3B eager).
  # `min_dim` shares the same `min_kernel` in that file, so it is excluded too.
  - min
  - min_dim
  # `aten::nonzero` (kernel fn `nonzero`) is the first FlagGems kernel the same
  # `torch._tensor_str` formatting path runs (`data[mask]` -> nonzero + index).
  # In the 35B-A3B run TP0 emitted the `nonzero.py` warnings and then logged the
  # first `kl3ChannelCheckErrors ... status= 700` of that job, so it stays off
  # the generated kernel too.
  - nonzero
  # `aten::fill_.Scalar` (kernel fn `fill_scalar_`,
  # flag_gems/runtime/backend/_kunlunxin/ops/fill.py:128) is the FIRST kernel of
  # the first decode step in the Qwen3.6-35B-A3B graph run: `_prepare_inputs`
  # does `self.num_accepted_tokens.gpu.fill_(1)`, which JIT-compiles
  # `fill_scalar_func_kernel_rank_1` (the `jit_monitor` "Triton kernel JIT
  # compilation during inference" warning is logged one line above the crash)
  # and then faults with
  # `xpuLaunchKernel("fill_scalar_func_kernel_rank_1", ...) -> Exception in
  # kernel execution(err_code: -714)`, surfacing as
  # `kl3ChannelCheckErrors ... error set to 66250, status= 700` +
  # `A kernel exception has occurred` + an async "illegal memory access" that
  # kills all four TP workers.  `aten::fill_.Tensor` (kernel fn `fill_tensor_`)
  # reaches the same `fill_scalar_func` through the plain Python helper
  # `fill_tensor_ -> fill_scalar_` (no dispatch involved), so excluding
  # `fill_scalar_` alone would not protect that overload; the out-of-place
  # `fill_scalar` / `fill_tensor` launch the identical kernel with the identical
  # CodeGenConfig.  Filling with a scalar has no reason to use a generated
  # kernel, so the whole family stays on the vendor ATen path.
  - fill_scalar_
  - fill_tensor_
  - fill_scalar
  - fill_tensor
  # `aten::index` (kernel fn `index`, flag_gems/runtime/backend/_kunlunxin/ops/
  # index.py) is the next kernel of the same first decode step, right after the
  # fill_ family above.  `_prepare_inputs` does
  # `self.num_computed_tokens[req_indices_gpu].to(torch.int64)`
  # (vllm_fl/worker/model_runner.py:2236 in _prepare_inputs), which selects the
  # FlagGems path `index.py:468 index -> index.py:292 __call__` and JIT-compiles
  # `.flaggems/code_cache/index_inp_rank_1_indices_len_1_index_rank_1.py:82
  # _index_wrapper`, then faults with
  # `xpuLaunchKernel("_index_jit_function", ...) -> Exception in kernel execution
  # (err_code: -714)`, killing all four TP workers at the same instant
  # (`kl3ChannelCheckErrors ... status= 700` + async "illegal memory access").
  # Only the Qwen3.6-35B-A3B graph step hits it: the grid is tiny
  # (`indices_len=1`, one request, first decode step).  The same kernel was
  # JIT-compiled without faulting in the 27b_tp4_eager run, i.e. it degrades at
  # this shape rather than being unconditionally broken.  The `.to(int64)` is
  # the user of the result, not the faulting kernel, so the cast stays put.
  # Gathering a handful of scalars has no reason to use a generated kernel:
  # keep `aten::index` on the vendor ATen path.
  - index
  - gelu
  - masked_scatter_
  - scatter
  - scatter_
  - scatter_add_
  - select_scatter
  - slice
  - slice_scatter
  - softmax
  - sort
  - topk_softmax
  - attention_backend
  # --- OOT ops never registered through FlagGems ---
  - chunk_gated_delta_rule_fwd
  - fused_recurrent_gated_delta_rule_fwd
  - causal_conv1d_fn
  - causal_conv1d_update
  - fused_gdn_gating
  # `aten::lt` reached from vLLM 0.28's PyTorch top-k/top-p sampler
  # (`topk_topp_sampler.py: apply_top_k_top_p_pytorch` -> `logits_sort < top_k_mask`)
  # takes the whole EngineCore down on the P800: the flag_gems
  # `pointwise_dynamic` kernel is rejected by the TritonXPU compare-fusion
  # pipeline (`triton_xpu.cmpf` receives `tensor<...xui32>`), which surfaces as
  # the misleading `OutOfResources: uni_sram` -> every TP worker dies ->
  # `POST /v1/chat/completions` answers HTTP 500.  Reproduced with flag_gems
  # alone (no vLLM involved); `TRITONXPU_COMPARE_FUSION=0` does not help.
  # `ge` is the same defect (hit by `batched_count_greater_than` whenever a
  # request asks for logprobs); `le`/`gt` are the same kernel family.
  # Upstream issue: https://github.com/flagos-ai/FlagGems/issues/7965
  # Drop these entries once FlagGems fixes it.
  - lt
  - le
  - ge
  - gt


# OOT (Out-of-Tree) operator blacklist
# These operators will NOT be registered as OOT replacements.
# oot_blacklist:
#   - fused_moe
