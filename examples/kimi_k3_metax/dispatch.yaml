  silu_and_mul: [flagos]
  gelu_and_mul: [flagos]
  rms_norm: [flagos]
  rotary_embedding: [flagos]
  attention_backend: [vendor:metax]
  moe_align_block_size: [flagos]
  moe_sum: [flagos]
  topk_softmax: [flagos]
  invoke_fused_moe_triton_kernel: [flagos]
  grouped_topk: [flagos]
  kimi_k3_prepare_experts: [vendor:metax]
  kimi_k3_tp8_experts: [vendor:metax]
  kimi_k3_grouped_experts: [vendor:metax]
  kimi_k3_situ_out: [vendor:metax]
  kimi_k3_mla_tp8: [vendor:metax]
  kimi_k3_prefill_mma: [vendor:metax]
  kimi_k3_prefill_attention: [vendor:metax]
  kimi_k3_cache_gather: [vendor:metax]
  kimi_k3_query_projection: [vendor:metax]
  kimi_k3_chunk_kda: [vendor:metax]
  kimi_k3_linear: [vendor:metax]
  kimi_k3_latent_projection: [vendor:metax]
  kimi_k3_latent_up: [vendor:metax]
  kimi_k3_small_projection: [vendor:metax]
  kimi_k3_vision_rope: [vendor:metax]
