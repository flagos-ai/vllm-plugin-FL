# Native vLLM serving profile; checkpoint sampling remains authoritative.
tensor-parallel-size: 8
pipeline-parallel-size: 1
dtype: "bfloat16"
max-model-len: 69632
max-num-seqs: 64
max-num-batched-tokens: 8192
gpu-memory-utilization: 0.92
language-model-only: true
enable-prefix-caching: false
enable-chunked-prefill: true
mamba-cache-mode: "none"
mamba-ssm-cache-dtype: "float32"
async-scheduling: true
generation-config: "auto"
compilation-config:
  mode: 0
  cudagraph_mode: "FULL_DECODE_ONLY"
  cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64]
  max_cudagraph_capture_size: 64
disable-custom-all-reduce: true
cudagraph-metrics: true
additional-config:
  flaggems_record_ops: false
  qwen38_ngram_mode: "uva_auto"
  qwen38_mtp_graph: false
  qwen38_qsa_length_buckets: true
  qwen38_qsa_packing: true
  qwen38_fused_qsa_metadata: true
  qwen38_fused_gemma_norm: true
  qwen38_hc_small_fusions: true
  qwen38_qsa_long_context: true
  qwen38_qsa_native_attention: true
  qwen38_reuse_gdn_metadata: true
  qwen38_gdn_host_metadata: true
  qwen38_ple_cpu_metadata: true
  qwen38_tuning_profile: true
host: "127.0.0.1"
port: 18170
served-model-name: "qwen38"
