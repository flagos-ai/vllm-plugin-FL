# LLaVA-OneVision-2 8B V2 single-image semantic smoke test.

llm:
  model: "/data/models/LLaVA-OneVision-2-8B-Instruct"
  tensor_parallel_size: 1
  max_num_seqs: 1
  max_model_len: 4096
  # Require a mostly free A800 during encoder profiling and graph capture.
  gpu_memory_utilization: 0.8
  trust_remote_code: true

generate:
  modality: image
  placeholder: "<|vision_start|><|image_pad|><|vision_end|>"
  assets: ["stop_sign"]
  prompts:
    - question: "What word is written on the sign? Answer with one word."
      asset_count: 1
      expected: "stop"
  sampling:
    max_tokens: 32
    temperature: 0
  parametrize:
    enforce_eager: [true, false]
