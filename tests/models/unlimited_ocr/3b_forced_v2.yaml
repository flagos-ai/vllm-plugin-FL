llm:
  model: "/data/models/PaddlePaddle/Unlimited-OCR"
  max_num_seqs: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.4
  enforce_eager: true
  trust_remote_code: true

generate:
  runner_override: v2
  expected_runner: v2
  modality: image
  placeholder: "<image>"
  assets: ["/data/models/PaddlePaddle/Unlimited-OCR/assets/baidu.png"]
  prompts:
    - question: "document parsing."
      asset_count: 1
      expected_regex: "(?i)(baidu|百度)"
  sampling:
    max_tokens: 64
    temperature: 0.0
