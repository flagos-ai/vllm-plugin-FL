# Manual only: run via .github/scripts/cuda/run_regression.py on reserved GPUs.
llm:
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 4096
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  gpu_memory_utilization: 0.3
  enforce_eager: true
  seed: 0
  trust_remote_code: false
  compilation_config:
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
  model: REQUIRED_LOCAL_MODEL_PATH
  limit_mm_per_prompt:
    image: 2
    video: 0
generate:
  sampling:
    temperature: 0.0
    max_tokens: 96
nvidia_validation:
  runner: v2
  kind: paired_images
  minimum_memory_gib: 24
  chat_template_kwargs:
    enable_thinking: false
    thinking: false
  expected_architectures:
  - MiniCPMV4_7ForConditionalGeneration
  expected_model_class: vllm.model_executor.models.minicpmv4_7.MiniCPMV4_7ForConditionalGeneration
