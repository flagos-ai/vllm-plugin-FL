# Manual only: run via .github/scripts/cuda/run_regression.py on reserved GPUs.
llm:
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 2048
  max_num_seqs: 8
  max_num_batched_tokens: 512
  gpu_memory_utilization: 0.25
  enforce_eager: false
  seed: 0
  trust_remote_code: false
  compilation_config:
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
  model: REQUIRED_LOCAL_MODEL_PATH
generate:
  prompts:
  - text: What is 2 + 2? Give only the number.
    expected: '4'
    accepted_exact:
    - '4'
  - text: What is the capital of France? Answer with one word.
    expected: Paris
    accepted_exact:
    - Paris
    - Paris.
  - text: Translate cat into Chinese. Answer with one word.
    expected: 猫
    accepted_exact:
    - 猫
  - text: 'Reply with exactly: NVIDIA EMPTY ready'
    expected: NVIDIA EMPTY ready
    accepted_exact:
    - NVIDIA EMPTY ready
  sampling:
    temperature: 0.0
    max_tokens: 64
nvidia_validation:
  runner: v1
  kind: text
  minimum_memory_gib: 48
  chat_template_kwargs:
    enable_thinking: false
    thinking: false
  expected_architectures:
  - Qwen3ForCausalLM
  expected_model_class: vllm.model_executor.models.qwen3.Qwen3ForCausalLM
