# Tsingmicro TX8110 bounded smoke configuration (TP=8, eager).
llm:
  model: "/models/Qwen/Qwen3.6-35B-A3B"
  tensor_parallel_size: 8
  pipeline_parallel_size: 1
  max_model_len: 1024
  max_num_batched_tokens: 1024
  max_num_seqs: 2
  kv_cache_memory_bytes: 134217728
  gpu_memory_utilization: 0.90
  enforce_eager: true
  trust_remote_code: true
  disable_custom_all_reduce: true

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 64
    temperature: 0.0

serve:
  served_model_name: "qwen"
  startup_retries: 180
  endpoints: ["chat"]
  stream: false
  max_tokens: 64
  chat_template_kwargs:
    enable_thinking: false
  chat_cases:
    - name: text
      messages:
        - role: "user"
          content: "What is the capital of France? Answer in one short sentence."
      expected: "Paris"
    - name: image
      generated_image: true
      prompt: "Describe all visible text, colors, and shapes in English."
      expected: ["Hello VLM", "blue rectangle"]
  sampling:
    temperature: 0.0
