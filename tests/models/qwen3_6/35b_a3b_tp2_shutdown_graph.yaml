# Issue #531: Hygon TP=2 graph serving, followed by process-group Ctrl+C.
# Keep this case outside the Hygon device override that forces eager serving.
# Bounded SIGKILL fallback is permitted; no live owned process may remain.

llm:
  model: "/data/models/Qwen/Qwen3.6-35B-A3B"
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  max_model_len: 262144
  gpu_memory_utilization: 0.9
  enforce_eager: false
  trust_remote_code: false
  disable_custom_all_reduce: false

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 100
    temperature: 0.0

serve:
  served_model_name: "qwen"
  startup_retries: 180
  # False engine values are omitted by serve_args(), so use explicit CLI flags.
  extra_args:
    - "--no-enable-log-requests"
    - "--no-enable-prefix-caching"
  endpoints: ["chat"]
  stream: false
  max_tokens: 256
  chat_cases:
    - name: text
      messages:
        - role: "user"
          content: "The capital of France is"
      expected: "Paris"
  sampling:
    temperature: 0.0
