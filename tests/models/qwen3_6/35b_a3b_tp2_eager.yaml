# Qwen3.6-35B-A3B Hygon smoke configuration (TP=2, eager).

llm:
  model: "/data/models/Qwen/Qwen3.6-35B-A3B"
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.95
  enforce_eager: true
  trust_remote_code: false
  disable_custom_all_reduce: true

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 100
    temperature: 0.0

serve:
  served_model_name: "qwen"
  startup_retries: 120
  endpoints: ["chat"]
  stream: false
  max_tokens: 256
  chat_cases:
    - name: text
      messages:
        - role: "user"
          content: "The capital of France is"
      expected: "Paris"
    - name: image
      generated_image: true
      prompt: "Describe all visible text, colors, and shapes in English."
      expected:
        - "Hello VLM"
        - "blue rectangle"
  sampling:
    temperature: 0.0
