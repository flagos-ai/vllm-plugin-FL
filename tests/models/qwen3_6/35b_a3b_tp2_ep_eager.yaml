# Qwen3.6-35B-A3B Ascend smoke configuration (TP=2, EP=2, eager).

llm:
  model: "/data/models/Qwen/Qwen3.6-35B-A3B"
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  enable_expert_parallel: true
  max_num_seqs: 2
  max_model_len: 8192
  gpu_memory_utilization: 0.95
  enforce_eager: true
  trust_remote_code: true
  disable_custom_all_reduce: true

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
    - text: "用简洁准确的语言解释张量并行。"
  sampling:
    max_tokens: 64
    temperature: 0.0

serve:
  served_model_name: "qwen"
  startup_retries: 180
  endpoints: ["chat"]
  stream: false
  max_tokens: 256
  extra_args:
    - "--enable-expert-parallel"
    - "--max-num-seqs=2"
  chat_cases:
    - name: text
      messages:
        - role: "user"
          content: "The capital of France is"
      expected: "Paris"
  sampling:
    temperature: 0.0
