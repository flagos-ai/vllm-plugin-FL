# Manual only: run via .github/scripts/cuda/run_regression.py on reserved GPUs.
llm:
  tensor_parallel_size: 8
  dtype: auto
  max_model_len: 1024
  max_num_seqs: 1
  max_num_batched_tokens: 1024
  gpu_memory_utilization: 0.94
  enforce_eager: true
  seed: 0
  trust_remote_code: false
  model: REQUIRED_LOCAL_MODEL_PATH
  pipeline_parallel_size: 1
  engram_config:
    cpu_offload: false
  kv_cache_dtype: auto
  attention_config:
    indexer_kv_dtype: fp8
    indexer_sparse_logits: false
generate:
  prompts:
  - text: What is 2 + 2? Give only the number.
    expected: '4'
    accepted_exact:
    - '4'
  - text: What is the capital of France? Answer with one word.
    expected: Paris
    accepted_exact:
    - Paris
    - Paris.
  - text: Translate cat into Chinese. Answer with one word.
    expected: 猫
    accepted_exact:
    - 猫
  - text: 'Reply with exactly: NVIDIA EMPTY ready'
    expected: NVIDIA EMPTY ready
    accepted_exact:
    - NVIDIA EMPTY ready
  sampling:
    temperature: 0.0
    max_tokens: 64
nvidia_validation:
  runner: v2
  kind: text
  minimum_memory_gib: 70
  chat_template_kwargs:
    enable_thinking: false
    thinking: false
  expected_architectures:
  - DeepseekV41ForCausalLM
  expected_model_class: vllm.models.deepseek_v41.nvidia.vl_model.DeepseekV41ForCausalLM
