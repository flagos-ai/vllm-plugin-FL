llm:
  model: "/data/models/Qwen/Qwen3.5-0.8B"
  max_num_seqs: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.3
  enforce_eager: true
  trust_remote_code: true

generate:
  runner_override: auto
  expected_runner: v1
  prompts:
    - text: "The capital of France is"
      expected_regex: "^\\s*Paris"
  sampling:
    max_tokens: 16
    temperature: 0.0
