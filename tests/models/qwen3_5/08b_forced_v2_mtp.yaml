llm:
  model: "/data/models/Qwen/Qwen3.5-0.8B"
  max_num_seqs: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.3
  enforce_eager: true
  trust_remote_code: true
  speculative_config:
    method: mtp
    num_speculative_tokens: 1

generate:
  runner_override: v2
  expected_runner: v2
  modality: image
  placeholder: "<|vision_start|><|image_pad|><|vision_end|>"
  assets: ["stop_sign"]
  prompts:
    - question: "What word is written on the sign? Answer with one word."
      asset_count: 1
      expected: "stop"
  sampling:
    max_tokens: 32
    temperature: 0.0
