# Real checkpoint smoke; requires 16 NVIDIA GPUs and this mounted checkpoint.
# Distributed two-node acceptance uses the documented external MP launch.
llm:
  model: /data/models/Hy4-preview-FP8-Testing
  tensor_parallel_size: 16
  pipeline_parallel_size: 1
  enable_expert_parallel: true
  enable_ep_weight_filter: true
  all2all_backend: allgather_reducescatter
  load_format: hy4_safetensors
  dtype: bfloat16
  kv_cache_dtype: auto
  max_model_len: 4096
  max_num_batched_tokens: 4096
  max_num_seqs: 4
  gpu_memory_utilization: 0.92
  enforce_eager: true
  enable_prefix_caching: false
  disable_custom_all_reduce: true

generate:
  prompts:
    - text: 'Finish the sentence: The capital of France is'
      expected: 'Paris'
  sampling:
    temperature: 0.0
    max_tokens: 512
serve:
  endpoints: [chat]
  chat_cases:
    - name: color_semantics
      messages:
        - role: user
          content: 'What color do you get when you mix blue and yellow paint? Answer briefly.'
      expected: green
  max_tokens: 512
  sampling:
    temperature: 0.0
