# DeepSeek-V2-Lite-Chat MoE/MLA V2 runner smoke test.

llm:
  model: "/data/models/DeepSeek-V2-Lite-Chat"
  tensor_parallel_size: 1
  max_num_seqs: 2
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  trust_remote_code: true

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
      expected_regex: '^\s*Paris\.'
    - text: "Hello, my name is"
  sampling:
    max_tokens: 16
    temperature: 0.0
  parametrize:
    enforce_eager: [true, false]
