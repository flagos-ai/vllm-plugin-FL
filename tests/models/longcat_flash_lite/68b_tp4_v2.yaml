# LongCat-Flash-Lite 68.5B MoE + n-gram embedding (V2-only, TP=4).

llm:
  model: "/data/models/meituan-longcat/LongCat-Flash-Lite"
  tensor_parallel_size: 4
  max_num_seqs: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  trust_remote_code: true

generate:
  runner_override: v2
  expected_runner: v2
  prompts:
    - "Hello, my name is"
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 32
    temperature: 0.0
    repetition_penalty: 1.06
