# Qwen3.8-27B dense multimodal model configuration (TP=2, text smoke test)

llm:
  model: "/data/models/Qwen/Qwen3.8-27B"
  tensor_parallel_size: 2
  max_num_seqs: 2
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  enforce_eager: true
  trust_remote_code: true

generate:
  prompts:
    - "Hello, my name is"
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 32
    temperature: 0.0
