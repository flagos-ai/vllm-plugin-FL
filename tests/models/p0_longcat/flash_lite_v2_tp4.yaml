# P0-8: LongCat-Flash-Lite MRV2-only large-model smoke test.

llm:
  model: "/data/models/LongCat-Flash-Lite"
  tensor_parallel_size: 4
  max_num_seqs: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  enforce_eager: true
  trust_remote_code: true

generate:
  prompts:
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 32
    temperature: 0.0
