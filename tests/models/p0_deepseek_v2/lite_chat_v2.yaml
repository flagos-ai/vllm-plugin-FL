# P0-2: MoE + MLA whitelist path, expected to auto-select Model Runner V2.

llm:
  model: "/data/models/DeepSeek-V2-Lite-Chat"
  tensor_parallel_size: 1
  max_num_seqs: 2
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  enforce_eager: true
  trust_remote_code: true

generate:
  prompts:
    - "Hello, my name is"
    - text: "The capital of France is"
      expected: "Paris"
  sampling:
    max_tokens: 32
    temperature: 0.0
