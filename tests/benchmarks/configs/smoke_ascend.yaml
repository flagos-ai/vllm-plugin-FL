# Keep the benchmark within the currently validated Ascend V2 eager settings.
# The no_* keys produce explicit --no-* flags in the shared CLI converter.
serve:
  - name: serve_smoke_dummy
    model: qwen3
    case: 06b_tp2
    server_parameters:
      served_model_name: smoke-model
      tensor_parallel_size: 1
      dtype: bfloat16
      max_model_len: 1024
      max_num_seqs: 4
      gpu_memory_utilization: 0.3
      enforce_eager: true
      no_enable_chunked_prefill: true
      no_async_scheduling: true
      no_enable_prefix_caching: true
      load_format: dummy
      startup_retries: 180
      poll_interval: 10
    client_parameters:
      model: smoke-model
      backend: openai-chat
      endpoint: /v1/chat/completions
      dataset_name: random
      random_input_len: 32
      random_output_len: 4
      num_prompts: 5
      percentile_metrics: ttft,tpot,itl,e2el
      goodput: e2el:10000
