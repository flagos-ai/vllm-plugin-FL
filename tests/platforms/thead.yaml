platform: thead
vendor: thead

device_types:
  zw810e:
    compute_capability: "8.0"
    memory_gb: 96
    tags: [ppu, bf16, cuda-compatible]

# Default numerical tolerance for result comparison.
tolerance:
  inference:
    default: {exact: true}

# Device-level overrides for specific devices or categories.
device_overrides:
  zw810e:
    cases:
      - qwen3_6/27b_tp4_eager
      - qwen3_6/27b_tp4_graph
      - qwen3_6/35b_a3b_tp4_eager
      - qwen3_6/35b_a3b_tp4_graph
    llm:
      gpu_memory_utilization: 0.85
      trust_remote_code: true
      # Upstream's default table captures 51 sizes. This six-size table keeps
      # graph capture within the e2e job time budget while covering the tested
      # batch sizes (same approach as hygon's bw1000 overrides).
      compilation_config:
        cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]
    serve:
      startup_retries: 300
      # The shared CLI adapter stringifies structured engine options, so the
      # serving path needs the JSON form.
      extra_engine:
        compilation_config: '{"cudagraph_capture_sizes":[1,2,4,8,16,32]}'

# Features not supported on this platform.
# Test cases whose model name contains any of these strings will be skipped.
# Example: ["flaggems"] would skip "qwen3_flaggems" cases.
unsupported_features: []

# Default environment variables for this platform (applied by run.py before tests
# start). These are a fallback for running outside the CI image; the image sets
# the same keys via ENV and apply_env_defaults uses setdefault, so they are
# no-ops there. LD_LIBRARY_PATH is deliberately absent: it must be appended to,
# and setdefault would replace the image's system library path.
env_defaults:
  VLLM_PLUGINS: "fl"
  VLLM_TARGET_DEVICE: "empty"
  GEMS_VENDOR: "thead"
  USE_FLAGGEMS: "1"
  TORCH_DEVICE_BACKEND_AUTOLOAD: "1"
  FLAGCX_PATH: "/sgl-workspace/FlagCX"

zw810e:
  name: "zw810e"
  tests:
    e2e:
      pr:
        inference:
          qwen3_6:
            - 27b_tp4_eager
            - 27b_tp4_graph
            - 35b_a3b_tp4_eager
            - 35b_a3b_tp4_graph
        serving:
          qwen3_6:
            - 27b_tp4_eager
            - 27b_tp4_graph
            - 35b_a3b_tp4_eager
            - 35b_a3b_tp4_graph
      nightly:
        inference:
          qwen3_6:
            - 27b_tp4_eager
            - 27b_tp4_graph
            - 35b_a3b_tp4_eager
            - 35b_a3b_tp4_graph
        serving:
          qwen3_6:
            - 27b_tp4_eager
            - 27b_tp4_graph
            - 35b_a3b_tp4_eager
            - 35b_a3b_tp4_graph
        concurrent:
          qwen3_6:
            - 27b_tp4_eager
            - 35b_a3b_tp4_graph
    timeouts:
      e2e:
        # All four TP4 cases serialize on the four visible cards. The cold
        # inference job reached the 120-minute job limit in CI; allow the same
        # budget as serving so cancellation does not hide case-level results.
        inference: 180
        serving: 180
        concurrent: 180
    functional:
      include: "*"
      exclude: []
    unit:
      include: "*"
      exclude: []
    benchmark:
      pr:
        enabled: false
      nightly:
        enabled: false
