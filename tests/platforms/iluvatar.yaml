# Iluvatar CoreX Platform Configuration
platform: iluvatar
vendor: iluvatar

device_types:
  bi-v150:
    memory_gb: 32
    tags: [iluvatar, corex, bf16]

tolerance:
  inference:
    default:  {rtol: 1e-3, atol: 1e-3}
    bfloat16: {rtol: 1e-2, atol: 1e-2}
    float16:  {rtol: 1e-2, atol: 1e-2}

device_overrides: {}

unsupported_features: []

env_defaults:
  VLLM_PLUGINS: "fl"

bi-v150:
  name: "bi-v150"
  tests:
    e2e:
      pr:
        inference:
          qwen3_6:
            - 27b_tp4_eager
            - 35b_a3b_tp4_eager
      nightly:
        inference:
          qwen3_6:
            - 27b_tp4_eager
            - 35b_a3b_tp4_eager
        serving:
          qwen3_6:
            - 35b_a3b_tp4_eager
    timeouts:
      e2e:
        inference: 180
        serving: 180
    functional:
      include: "*"
      exclude: []
    unit:
      include: "*"
      exclude: []
