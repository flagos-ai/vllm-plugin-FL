platform: enflame
vendor: gcu

device_types:
  s60:
    memory_gb: 42
    tags: [enflame, gcu, bf16, fp16, fp32]

tolerance:
  inference:
    default:
      rtol: 1e-3
      atol: 1e-3
    bfloat16:
      rtol: 1e-2
      atol: 1e-2

device_overrides:
  s60:
    cases:
      - qwen3_6/27b_tp2_eager
      - qwen3_6/27b_tp2_graph
      - qwen3_6/35b_a3b_tp2_eager
      - qwen3_6/35b_a3b_tp2_graph
    llm:
      gpu_memory_utilization: 0.90
      max_num_seqs: 64
      # Bound prefill/profile workspace independently of decode capture sizes.
      max_num_batched_tokens: 4096
      disable_custom_all_reduce: false
      # Explicit FL SiLU dispatch is required by the validated S60 cases.
      # Do not extend this policy to other models without validation.
      compilation_config:
        custom_ops: ["none", "+SiluAndMul"]
        cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]

env_defaults:
  VLLM_PLUGINS: "fl"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "99999"
  TORCH_GCU_ENABLE_INT64_AND_UINT64: "1"
  ENABLE_I64_CHECK: "0"
  TORCHGCU_INDUCTOR_ENABLE: "1"
  GRAPH_COMPILATION_CONFIG: '{"cudagraph_capture_sizes":[1,2,4,8,16,32]}'
# Set TORCHINDUCTOR_EMULATE_PRECISION_CASTS=1 explicitly only for validated
# BF16 compiled runs; it is not a platform-wide test default.

s60:
  name: "s60"
  tests:
    e2e:
      pr:
        inference:
          qwen3_6:
            - 27b_tp2_eager
            - 27b_tp2_graph
        serving:
          qwen3_6:
            - 35b_a3b_tp2_graph
      nightly:
        inference:
          qwen3_6:
            - 27b_tp2_eager
            - 27b_tp2_graph
        serving:
          qwen3_6:
            - 35b_a3b_tp2_graph
        concurrent:
          qwen3_6:
            - 27b_tp2_eager
    timeouts:
      e2e:
        inference: 120
        serving: 120
        concurrent: 120
    functional:
      include: "*"
      exclude: []
    unit:
      include: "*"
      exclude: []
    benchmark:
      pr:
        enabled: true
        types:
          - serve
      nightly:
        enabled: true
        types:
          - serve
