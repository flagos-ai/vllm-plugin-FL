platform: tsingmicro
vendor: tsingmicro

device_types:
  tx8110:
    memory_gb: 64
    tags: [tsingmicro, txda, bf16, fp16, fp32]

tolerance:
  inference:
    default: {rtol: 1e-3, atol: 1e-3}
    bfloat16: {rtol: 1e-2, atol: 1e-2}

env_defaults:
  FL_BACKEND: "tsingmicro"
  GEMS_VENDOR: "tsingmicro"
  VLLM_PLUGINS: "fl"
  VLLM_USE_V2_MODEL_RUNNER: "0"
  TXDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  FL_MODEL_BASE_PATH: "/models"

tx8110:
  name: "tx8110"
  tests:
    e2e:
      inference:
        qwen3_6: ["27b_tp8_eager", "35b_a3b_tp8_eager"]
      serving:
        qwen3_6: ["27b_tp8_eager", "35b_a3b_tp8_eager"]
    functional:
      include: []
      exclude: []
    unit:
      include: ["txda"]
      exclude: []
    benchmark:
      enabled: false
