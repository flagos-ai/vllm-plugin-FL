# Copyright 2026 FlagOS Contributors
# vLLM 0.32.0 empty, using the vendor Python 3.10 compatibility build.
platform: sunrise
vendor: sunrise
device_types:
  persistence_m:
    memory_gb: 64
    tags: [sunrise, ptpu, bf16, fp16, fp32]
env_defaults:
  GEMS_VENDOR: sunrise
  VLLM_PLUGINS: fl
  USE_FLAGGEMS: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TA_CLOSE_GRAPH_MEMORY: "1"
  PCCL_PROTO: Simple
device_overrides:
  persistence_m:
    cases:
      - qwen3_6/27b_tp2_eager
      - qwen3_6/27b_tp2_graph
      - qwen3_6/35b_a3b_tp2_eager
      - qwen3_6/35b_a3b_tp2_graph
    llm:
      kv_cache_memory_bytes: 4294967296
      max_model_len: 8192
      max_num_seqs: 8
persistence_m:
  name: persistence_m
  tests:
    unit:
      include:
        - tests/unit_tests/dispatch/test_sunrise_attention.py
        - tests/unit_tests/dispatch/test_sunrise_runtime.py
        - tests/unit_tests/dispatch/test_sunrise_graph_capture.py
        - tests/unit_tests/dispatch/test_sunrise_embedding.py
        - tests/unit_tests/dispatch/test_sunrise_kv_cache.py
        - tests/unit_tests/dispatch/test_sunrise_cache_update.py
        - tests/unit_tests/distributed/test_sunrise_flagcx_wheel.py
        - tests/unit_tests/worker/test_sunrise_worker.py
        - tests/unit_tests/worker/test_sunrise_model_runner.py
        - tests/unit_tests/worker/test_sunrise_v2_model_runner.py
        - tests/unit_tests/test_sunrise_device_utils.py
        - tests/unit_tests/test_sunrise_python310.py
        - tests/unit_tests/test_sunrise_ir.py
        - tests/unit_tests/test_sunrise_compiler.py
      exclude: []
    functional:
      include:
        - tests/functional_tests/compilation/test_graph_capture.py
        - tests/functional_tests/ops/test_sunrise_kv_cache.py
        - tests/functional_tests/ops/test_sunrise_activation_compat.py
      exclude: []
    e2e:
      serving:
        qwen3_6: [27b_tp2_eager, 27b_tp2_graph, 35b_a3b_tp2_eager, 35b_a3b_tp2_graph]
