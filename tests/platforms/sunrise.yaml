# Copyright 2026 FlagOS Contributors
# vLLM 0.32.0 empty, using the vendor Python 3.10 compatibility build.
platform: sunrise
vendor: sunrise
device_types:
  persistence_m:
    memory_gb: 64
    tags: [sunrise, ptpu, bf16, fp16, fp32]
env_defaults:
  GEMS_VENDOR: sunrise
  VLLM_PLUGINS: fl
  USE_FLAGGEMS: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TA_CLOSE_GRAPH_MEMORY: "1"
  PCCL_PROTO: Simple
device_overrides:
  persistence_m:
    cases:
      - qwen3_6/27b_tp2_eager
      - qwen3_6/27b_tp2_graph
      - qwen3_6/35b_a3b_tp2_eager
      - qwen3_6/35b_a3b_tp2_graph
    llm:
      kv_cache_memory_bytes: 4294967296
      max_model_len: 8192
      max_num_seqs: 8
persistence_m:
  name: persistence_m
  tests:
    unit:
      include:
        - test_sunrise_attention
        - test_sunrise_runtime
        - test_sunrise_graph_capture
        - test_sunrise_embedding
        - test_sunrise_kv_cache
        - test_sunrise_flagcx_wheel
        - test_sunrise_worker
        - test_sunrise_model_runner
        - test_sunrise_v2_model_runner
        - test_sunrise_device_utils
        - test_sunrise_python310
        - test_sunrise_ir
        - test_sunrise_compiler
        - test_sunrise_graph_defaults
        - test_sunrise_test_config
        - test_sunrise_topk
      exclude: []
    functional:
      include:
        - test_graph_capture
        - test_sunrise_kv_cache
        - test_sunrise_activation_compat
        - test_sunrise_moe_routing
      exclude: []
    e2e:
      pr: &serving_cases
        serving:
          qwen3_6:
            - 27b_tp2_eager
            - 27b_tp2_graph
            - 35b_a3b_tp2_eager
            - 35b_a3b_tp2_graph
      nightly: *serving_cases
