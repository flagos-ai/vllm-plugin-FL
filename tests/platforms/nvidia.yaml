# CUDA-Based Platform Configuration
# Flexible test selection mechanism for NVIDIA GPU environments
#
# This platform configuration supports multiple device types (a100, a800, h100, h20)
# Users can modify the following:
# - functional: Add/remove test case names in the support lists
#   Example: aquila: ["tp2_pp2", "tp4_pp2"] -> add or remove items
#
# - unit: Add/remove paths in include and exclude lists
#   Example: include: "*" or ["test_basic.py", "runner/*"]
#            exclude: [] or ["test_spiky_loss_detector.py"]
#
# - tolerance: Adjust numerical comparison tolerance for result validation
#
# - unsupported_features: Exclude test cases matching specific feature tags
#
# ---- Platform-level settings ------------------------------------------------
platform: nvidia
vendor: nvidia

device_types:
  a100:
    compute_capability: "8.0"
    memory_gb: 80
    tags: [ampere, fp64, bf16]
  a800:
    compute_capability: "8.0"
    memory_gb: 80
    tags: [ampere, fp64, bf16, china-variant]
  h100:
    compute_capability: "9.0"
    memory_gb: 80
    tags: [hopper, fp8, bf16]
  h20:
    compute_capability: "9.0"
    memory_gb: 140
    tags: [hopper, fp8, bf16, china-variant]

# Default numerical tolerance for result comparison (used when device doesn't override)
tolerance:
  inference:
    default: {exact: true}

# Device-level overrides for specific test cases (optional)
device_overrides:
  h100:
    tolerance:
      inference:
        default: {rtol: 1e-4, atol: 1e-7}
  h20:
    cases:
      - qwen3_6/27b_tp2_eager
      - qwen3_6/27b_tp2_graph
      - qwen3_6/35b_a3b_tp2_eager
      - qwen3_6/35b_a3b_tp2_graph
    llm:
      max_model_len: 262144
    serve:
      stream: true
      max_tokens: 1024

# Features not supported on this platform.
# Test cases whose model name contains any of these strings will be skipped.
# Example: ["flaggems"] would skip "qwen3_flaggems", "robobrain2_flaggems", etc.
unsupported_features: []

# Default environment variables for this platform (informational / used by runners)
env_defaults:
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  NCCL_ALGO: "Ring"

# ---- Device-specific test configurations ------------------------------------
# Matrix follows the 0.5.0-dev line's own registry: the old-schema single
# case list is carried into both stages unchanged (the line's PR runs
# executed the full list; no light/dark split is invented here).
a100:
  name: "a100"
  tests:
    e2e:
      pr:
        inference:
          qwen3: ["4b_tp2", "next_tp8"]
          qwen3_5: ["35b_tp4"]
          minicpm: ["o45_tp4"]
        serving:
          qwen3: ["next_tp8"]
      nightly:
        inference:
          qwen3: ["4b_tp2", "next_tp8"]
          qwen3_5: ["35b_tp4"]
          minicpm: ["o45_tp4"]
        serving:
          qwen3: ["next_tp8"]
    functional:
      include: "*"
      exclude: []
    unit:
      include: "*"
      # Excluded pending upstream reconciliation of the #689 forward-sync
      # merge, which paired the 0.4.0-line registry implementation (native
      # present -> skip fallback, no _libs) with #615's fallback-behavior
      # tests, and carried 0.28-targeted musa tests onto the 0.32 stack.
      exclude:
        - test_op_schema_registry.py
        - test_musa_collective_splitting.py
        - test_musa_accelerator_patch.py
    benchmark:
      pr:
        enabled: true
        types: ["throughput", "latency", "serve"]
      nightly:
        enabled: true
        types: ["throughput", "latency", "serve"]

h20:
  name: "h20"
  tests:
    unit:
      include: "*"
      # Same #689-reconciliation excludes as a100 (see above); the registry
      # pair also failed h20-only before the rebase (dsw-worker Hopper
      # specificity, bisection 11-03) — tracked with the upstream owner.
      exclude:
        - test_op_schema_registry.py
        - test_musa_collective_splitting.py
        - test_musa_accelerator_patch.py
    e2e:
      pr:
        inference:
          qwen3_6: ["27b_tp2_eager", "35b_a3b_tp2_graph"]
        serving:
          qwen3_6: ["27b_tp2_graph", "35b_a3b_tp2_eager"]
      nightly:
        inference:
          qwen3_6: ["27b_tp2_eager", "35b_a3b_tp2_graph"]
        serving:
          qwen3_6: ["27b_tp2_graph", "35b_a3b_tp2_eager"]
    functional:
      include: "*"
      exclude: []

    # Exercise the existing benchmark smoke cases on the H20 CI image too.
    benchmark:
      pr:
        enabled: true
        types: ["throughput", "latency", "serve"]
      nightly:
        enabled: true
        types: ["throughput", "latency", "serve"]
